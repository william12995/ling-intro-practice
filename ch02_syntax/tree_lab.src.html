<title>Syntax Practice (prototype)</title>

<style>
:root{
  --ground:#F2F4F7; --surface:#FFFFFF; --ink:#1B2230; --muted:#5B6475; --line:#D9DEE7;
  --accent:#2F5BD3; --accent-soft:#E4EBFB; --cut:#D2463A; --cut-soft:#FBE7E4;
  --ok:#2E7D4F; --ok-soft:#E2F2E8; --warn:#9A6A12; --warn-soft:#F7EED9;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --serif:"IBM Plex Serif",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#12151C; --surface:#1A1F29; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2C3340;
    --accent:#8FA8F7; --accent-soft:#232D47; --cut:#F07A6E; --cut-soft:#3A2224;
    --ok:#6CC894; --ok-soft:#1C3326; --warn:#E0B55C; --warn-soft:#352C18;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#12151C; --surface:#1A1F29; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2C3340;
  --accent:#8FA8F7; --accent-soft:#232D47; --cut:#F07A6E; --cut-soft:#3A2224;
  --ok:#6CC894; --ok-soft:#1C3326; --warn:#E0B55C; --warn-soft:#352C18;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;padding:0 16px}
.wrap{max-width:760px;margin:0 auto;padding-block:32px 64px;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,5vw,38px);line-height:1.2;margin:0;text-wrap:balance}
h1 .plus{color:var(--cut);font-family:var(--mono);font-weight:500;padding:0 .12em}
.lede{color:var(--muted);margin:0;max-width:62ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab .score{font-family:var(--mono);font-size:13px;margin-left:6px;color:var(--muted);font-variant-numeric:tabular-nums}
.levels{display:flex;gap:8px;flex-wrap:wrap}
.lv{appearance:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.lv[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:18px}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums}

.q{font-size:18px;margin:0}

.data{font-family:var(--mono);font-size:14px;background:var(--ground);border-radius:6px;padding:10px 14px;overflow-x:auto;white-space:pre;line-height:1.7}
.opts{display:grid;gap:8px}
.opt{appearance:none;text-align:left;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.opt:hover:not(:disabled){border-color:var(--accent)}

.opt.seg{font-family:var(--mono);font-size:17px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}

.gap{appearance:none;border:0;background:none;width:14px;padding:0;cursor:pointer;position:relative;color:inherit}

.hint{font-size:14px;color:var(--muted);margin:0}
.readout{font-family:var(--mono);font-size:15px;color:var(--muted);min-height:1.5em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--cut);vertical-align:middle;margin-right:6px}

.who b{color:var(--ink);font-weight:500;font-family:var(--mono)}
.linkbtn{appearance:none;border:0;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.sync{font-family:var(--mono);font-size:13px}

.login{display:flex;flex-direction:column;gap:14px;max-width:420px}

.field label{font-size:14px;font-weight:500}

.keys{display:flex;gap:6px;flex-wrap:wrap}
.key{appearance:none;font-family:var(--mono);font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:2px 12px;cursor:pointer}
.dot.sub{background:var(--muted)}
.credit{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
#br{font-family:var(--mono);font-size:15px;line-height:1.6;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical;width:100%}
#br:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#br:disabled{background:var(--ground)}

pre.data{margin:8px 0 0}
details summary{cursor:pointer;font-weight:500;margin-bottom:8px}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Syntax · prototype</div>
    <h1>Build the tree</h1>
    <p class="lede">Step 1: bracket the sentence to show its structure. Step 2: drag a label onto every node.</p>
  </header>
  <div id="stage"></div>
  <p class="credit">Prototype. Trees follow the X-bar / TP notation of Anderson et al., <em>Essentials of Linguistics</em>, 2nd ed. (CC BY-NC-SA 4.0).</p>
</div>

<script>
/* ---------- 題目 ----------
   key 是帶標籤的括號寫法：[標籤 子…]，詞直接接在它的詞類標籤後面。$ 代表句中沒有發音的時態。
   判分：整棵帶標籤的樹（含子節點順序）要跟標準答案一樣。回饋另外比對「標籤+涵蓋的詞範圍」。 */
const ITEMS = [
  { ex:"Ex. 14a", words:["the","children","$","read","the","book"],
    key:"[TP [NP [DP the] [N' [N children]]] [T' [T $] [VP [V' [V read] [NP [DP the] [N' [N book]]]]]]]",
    e:"The subject <em>the children</em> is an NP: the determiner sits in the specifier position (DP, drawn with a triangle) and the noun is inside N'. There is no auxiliary, so T holds the abstract tense feature. T' joins T and the VP. The VP always has a V' inside it, and <em>the book</em> is the verb's complement." },
  { ex:"Ex. 14c", words:["the","weather","is","cold"],
    key:"[TP [NP [DP the] [N' [N weather]]] [T' [T is] [AP [A' [A cold]]]]]",
    e:"<em>Is</em> is a non-modal auxiliary (a form of <em>be</em>), so it is a T. Its complement is the adjective phrase <em>cold</em>, and every phrase has a bar level, so AP contains A'." },
  { ex:"Ex. 14d", words:["Emily","may","win","the","race"],
    key:"[TP [NP [N' [N Emily]]] [T' [T may] [VP [V' [V win] [NP [DP the] [N' [N race]]]]]]]",
    e:"<em>May</em> is a modal, so it is a T and heads the TP. Even a lone name gets a full NP with an N' inside it. <em>Win</em> takes <em>the race</em> as its complement, inside V'." },
  { ex:"Ex. 14e", words:["I","have","finished","my","homework"],
    key:"[TP [NP [N' [N I]]] [T' [T have] [VP [V' [V finished] [NP [DP my] [N' [N homework]]]]]]]",
    e:"<em>Have</em> is a non-modal auxiliary, so it is a T and <em>finished</em> is the main verb inside VP. <em>My</em> is a determiner in the specifier of the NP <em>my homework</em>." },
];
const LABELS = ["N","V","T","A","P","DP","N'","V'","T'","A'","P'","NP","VP","TP","AP","PP"];
const GROUPS = [["Word categories",["N","V","T","A","P","DP"]],["Bar levels",["N'","V'","T'","A'","P'"]],["Phrases",["NP","VP","TP","AP","PP"]]];

/* ---------- 括號解析（學生輸入和標準答案共用）。標籤可寫可不寫，沒寫的節點之後用拖曳補。 ---------- */
function parseBr(str){
  const tk = str.replace(/[’′]/g,"'").replace(/[［【]/g,"[").replace(/[］】]/g,"]").match(/\[|\]|[^\s\[\]]+/g) || [];
  let p = 0, leaf = 0; const leaves = [];
  function node(){
    p++;                                                     // [
    const n = {l:null, k:[]};
    if(LABELS.includes(tk[p])) n.l = tk[p++];
    while(tk[p] !== "]"){
      if(tk[p] === undefined) throw new Error("A [ is never closed. Every [ needs a matching ].");
      if(tk[p] === "[") n.k.push(node());
      else { leaves.push(tk[p]); n.k.push({w:tk[p++], i:leaf++}); }
    }
    if(!n.k.length) throw new Error("There is an empty pair of brackets.");
    const w = n.k.find(c => c.w !== undefined);
    if(w && n.k.length > 1) throw new Error(`Every word needs its own pair of brackets, like [${w.w}]. That pair is the node that will get the word's category.`);
    p++; return n;                                           // ]
  }
  if(!tk.length) throw new Error("Type your bracketing above. Example for “the cat”: [ [the] [ [cat] ] ]");
  if(tk[0] !== "[") throw new Error("The whole tree must start with [ and end with ].");
  const t = node();
  if(p < tk.length) throw new Error(tk[p] === "]" ? "There is an extra ] with no matching [." : "Something is outside the outermost brackets. The whole tree must be inside one pair of [ ].");
  return {tree:t, leaves};
}
const wordEq = (tok, w) => w === "$" ? /^[+\-–−]?PAST$/i.test(tok) : tok.toLowerCase() === w.toLowerCase();
function checkWords(leaves, words){
  if(leaves.length === words.length && leaves.every((t,i)=>wordEq(t, words[i]))) return "";
  return `The words in your brackets, in order, are: ${leaves.join(" ") || "(none)"}. They should be: ${words.map(w=>w==="$"?"–PAST":w).join(" ")}. Write the tense slot as –PAST or +PAST, in its own brackets.`;
}
function span(n){ if(n.w !== undefined){ n.s = n.e = n.i; } else { n.k.forEach(span); n.s = Math.min(...n.k.map(c=>c.s)); n.e = Math.max(...n.k.map(c=>c.e)); } }
function sigs(n, out=new Set()){ if(n.w !== undefined) return out; if(n.l){ n.sig = n.l+"|"+n.s+"|"+n.e; out.add(n.sig); } n.k.forEach(c=>sigs(c,out)); return out; }
const canon = (n, words) => n.w !== undefined ? words[n.i].toLowerCase() : `[${n.l} ${n.k.map(c=>canon(c,words)).join(" ")}]`;
const shape = n => n.w !== undefined ? "w" : "(" + n.k.map(shape).join("") + ")";
const shown = w => w === "$" ? "[–PAST]" : w;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clone = x => JSON.parse(JSON.stringify(x));
ITEMS.forEach(it => { const r = parseBr(it.key); if(checkWords(r.leaves, it.words)) console.warn("key/word mismatch", it.ex);
  it.tree = r.tree; span(it.tree); it.sigs = sigs(it.tree); it.canon = canon(it.tree, it.words); });

/* 把學生的詞換成句子的詞（統一大小寫和時態符號），並套上拖曳補的標籤。path 是節點在樹裡的位置。 */
function finish(tree, words, lab){
  (function walk(n, path){
    if(n.w !== undefined){ n.w = words[n.i]; return; }
    n.p = path; if(lab[path] !== undefined) n.l = lab[path];
    n.k.forEach((c,j) => walk(c, path + "." + j));
  })(tree, "r");
  span(tree); sigs(tree);
}
const nodesOf = n => n.w !== undefined ? [] : [n, ...n.k.flatMap(nodesOf)];

/* ---------- 畫樹（SVG）。interactive 時每個節點是可放標籤的格子 ---------- */
function drawTree(root, words, o={}){
  const colW = words.map(w => Math.max(64, shown(w).length*10 + 24));
  const cx = []; let acc = 0; colW.forEach(w => { cx.push(acc + w/2); acc += w; });
  const DY = 46, TOP = 22; let maxD = 0;
  (function lay(n, d){ n.y = TOP + d*DY; maxD = Math.max(maxD, d);
    if(n.w !== undefined){ n.x = cx[n.i]; return; }
    n.k.forEach(c => lay(c, d+1)); n.x = n.k.reduce((a,c)=>a+c.x, 0)/n.k.length; })(root, 0);
  let g = "";
  (function walk(n){
    if(n.w !== undefined){ g += `<text class="wd" x="${n.x}" y="${n.y+5}" text-anchor="middle">${esc(shown(n.w))}</text>`; return; }
    const tri = n.l === "DP" && n.k.length === 1 && n.k[0].w !== undefined;
    n.k.forEach(c => {
      if(tri) g += `<polygon class="ln" points="${n.x},${n.y+10} ${c.x-14},${c.y-14} ${c.x+14},${c.y-14}"/>`;
      else g += `<line class="ln" x1="${n.x}" y1="${n.y+11}" x2="${c.x}" y2="${c.y-13}"/>`;
    });
    n.k.forEach(walk);
    const w = n.l ? n.l.length*9.5 + 16 : 30, bad = o.bad && o.bad.has(n.sig);
    if(o.interactive) g += `<rect class="slot ${n.l?"":"empty"} ${o.chip?"armed":""}" data-p="${n.p}" x="${n.x-w/2}" y="${n.y-13}" width="${w}" height="26" rx="6"/>`;
    g += `<text class="lab ${n.l?"":"q"} ${bad?"bad":""}" x="${n.x}" y="${n.y+5}" text-anchor="middle">${n.l ? esc(n.l) : "?"}</text>`;
  })(root);
  const W = acc + 8, H = TOP + maxD*DY + 26;
  return `<svg class="tree" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Syntax tree">${g}</svg>`;
}

/* ---------- 狀態與畫面 ---------- */
const stage = document.getElementById("stage");
let cur = 0;
const S = ITEMS.map(() => ({text:"", lab:{}, shape:"", chip:null, done:false, ok:null}));
const okCount = () => S.filter(s => s.ok === true).length;
const describe = (sig, words) => { const [l,s,e] = sig.split("|"); return `<b>${esc(l)}</b> over <em>${words.slice(+s,+e+1).map(shown).join(" ")}</em>`; };

/* 讀學生的括號：回傳 {tree} 或 {err}。結構一改，拖過的標籤就作廢 */
function read(it, st){
  let r; try{ r = parseBr(st.text); }catch(e){ return {err:e.message}; }
  const bad = checkWords(r.leaves, it.words); if(bad) return {err:bad};
  const sh = shape(r.tree); if(sh !== st.shape){ st.lab = {}; st.shape = sh; }
  finish(r.tree, it.words, st.lab); return {tree:r.tree};
}

function render(){
  const it = ITEMS[cur], st = S[cur];
  const dots = ITEMS.map((_,k)=>`<span class="dot ${S[k].ok===true?"ok":S[k].ok===false?"no":""} ${k===cur?"cur":""}"></span>`).join("");
  stage.innerHTML = `<section class="card">
    <div class="meta"><span>${it.ex} · Sentence ${cur+1} of ${ITEMS.length}</span><div class="dots">${dots}</div></div>
    <p class="q">Draw the tree for <em>${it.words.filter(w=>w!=="$").join(" ")}.</em></p>
    <div class="steps">
      <p class="hint"><b>Step 1.</b> Type the bracketing. Every constituent gets a pair of brackets, and every word gets its own pair too, because that pair is the word's category node. Example for <em>the cat</em>: <code>[ [the] [ [cat] ] ]</code>. If the sentence has no auxiliary, the tense slot is a word too: <code>[–PAST]</code>. Your words, in order: <b class="mono">${esc(it.words.map(shown).join("  "))}</b></p>
      <p class="hint"><b>Step 2.</b> Drag a label from the box onto each <span class="qmark">?</span> in the tree. On a phone, tap a label, then tap the node. (You can also type labels inside the brackets, like <code>[NP ...]</code>.)</p>
    </div>
    <div class="field"><label for="br">Bracketing</label>
      <textarea id="br" spellcheck="false" autocomplete="off" autocapitalize="off" rows="4" ${st.done?"disabled":""}></textarea>
      ${st.done?"":`<div class="keys"><button class="key" data-i="[">[</button><button class="key" data-i="]">]</button><button class="key" data-i="–">–</button><button class="key" id="fmt">Tidy up</button></div>`}</div>
    <div class="treewrap" id="tw"></div>
    ${st.done?"":`<div class="palette" id="pal">${GROUPS.map(([nm,arr])=>`<div class="pgrp"><span class="pname">${nm}</span>${arr.map(l=>`<button class="chip" draggable="true" data-l="${esc(l)}">${esc(l)}</button>`).join("")}</div>`).join("")}</div>`}
    <div class="row"><span class="hint" id="need"></span><div class="btns">${st.done?"":`<button class="btn primary" id="submit">Submit</button>`}</div></div>
    <div id="result"></div>
    <div class="row"><div class="btns"><button class="btn" id="prev" ${cur?"":"disabled"}>Previous</button></div>
      <div class="btns"><button class="btn primary" id="next" ${st.done&&cur<ITEMS.length-1?"":"disabled"}>Next</button></div></div>
    ${S.every(s=>s.done)?`<p class="hint">All done: ${okCount()} / ${ITEMS.length} correct.</p>`:""}
  </section>`;
  const $ = q => stage.querySelector(q), ta = $("#br"), tw = $("#tw");
  ta.value = st.text;

  function place(path, label){                 // label 為 null 就是清掉
    if(label === null) delete st.lab[path]; else st.lab[path] = label;
    update();
  }
  function update(){
    const r = read(it, st); let ready = false, need = "";
    if(r.err){ tw.innerHTML = `<p class="hint">${esc(r.err)}</p>`; tw.classList.add("empty"); need = ""; }
    else {
      tw.classList.remove("empty");
      tw.innerHTML = drawTree(r.tree, it.words, {interactive:!st.done, chip:st.chip, bad:st.extra});
      const open = nodesOf(r.tree).filter(n => !n.l).length;
      ready = open === 0; need = st.done ? "" : open ? `${open} node${open>1?"s":""} still need a label` : "";
      st.cur = r.tree;
      tw.querySelectorAll("rect.slot").forEach(el => {
        const path = el.dataset.p;
        el.onclick = () => { if(st.chip) place(path, st.chip); else if(st.lab[path] !== undefined) place(path, null); };
        el.ondragover = e => { e.preventDefault(); el.classList.add("over"); };
        el.ondragleave = () => el.classList.remove("over");
        el.ondrop = e => { e.preventDefault(); const l = e.dataTransfer.getData("text/plain"); if(LABELS.includes(l)) place(path, l); };
      });
    }
    $("#need").textContent = need;
    if($("#submit")) $("#submit").disabled = !ready;
    stage.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", st.chip === c.dataset.l));
  }
  ta.oninput = () => { st.text = ta.value; update(); };
  stage.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
    const s0 = ta.selectionStart, e0 = ta.selectionEnd, c = b.dataset.i;
    ta.value = ta.value.slice(0,s0) + c + ta.value.slice(e0); ta.focus(); ta.setSelectionRange(s0+c.length, s0+c.length); ta.oninput();
  });
  if($("#fmt")) $("#fmt").onclick = () => {          // 每個包含子括號的節點換行縮排，方便看層次
    let r; try{ r = parseBr(st.text); }catch(e){ return; }
    const out = (n, d) => n.w !== undefined ? n.w : (n.k.every(c=>c.w!==undefined) ? `[${n.l?n.l+" ":""}${n.k.map(c=>c.w).join(" ")}]` : `[${n.l?n.l:""}\n${n.k.map(c=>"  ".repeat(d+1)+out(c,d+1)).join("\n")}]`);
    ta.value = out(r.tree, 0); ta.oninput();
  };
  stage.querySelectorAll(".chip").forEach(c => {
    c.ondragstart = e => { e.dataTransfer.setData("text/plain", c.dataset.l); e.dataTransfer.effectAllowed = "copy"; };
    c.onclick = () => { st.chip = st.chip === c.dataset.l ? null : c.dataset.l; update(); };
  });
  if($("#submit")) $("#submit").onclick = () => {
    const r = read(it, st); if(r.err) return;
    const mine = sigs(r.tree);
    st.missing = [...it.sigs].filter(x => !mine.has(x)); st.extra = new Set([...mine].filter(x => !it.sigs.has(x)));
    st.ok = canon(r.tree, it.words) === it.canon; st.done = true; st.chip = null; render();
  };
  if(st.done){
    const miss = st.missing.length ? `<span>Missing: ${st.missing.map(m=>describe(m,it.words)).join("; ")}.</span>` : "";
    const ext = st.extra.size ? `<span>Not in the standard tree (marked red in your tree): ${[...st.extra].map(m=>describe(m,it.words)).join("; ")}.</span>` : "";
    const same = !st.ok && !st.missing.length && !st.extra.size ? "<span>You have the same nodes as the standard tree, but they are stacked in a different order.</span>" : "";
    $("#result").innerHTML = `<div class="expl ${st.ok?"":"bad"}"><span class="verdict">${st.ok?"Correct":"Not quite"}</span>${miss}${ext}${same}<span>${it.e}</span></div>
      <details ${st.ok?"":"open"}><summary>Standard tree</summary><div class="treewrap">${drawTree(clone(it.tree), it.words)}</div><pre class="data">${esc(it.key.replace(/\$/g,"–PAST"))}</pre></details>`;
  }
  $("#prev").onclick = () => { cur--; render(); };
  $("#next").onclick = () => { cur++; render(); };
  update();
}
render();
</script>
