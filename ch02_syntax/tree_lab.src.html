<style>
:root{
  --ground:#F2F4F7; --surface:#FFFFFF; --ink:#1B2230; --muted:#5B6475; --line:#D9DEE7;
  --accent:#2F5BD3; --accent-soft:#E4EBFB; --cut:#D2463A; --cut-soft:#FBE7E4;
  --ok:#2E7D4F; --ok-soft:#E2F2E8; --warn:#9A6A12; --warn-soft:#F7EED9;

  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#12151C; --surface:#1A1F29; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2C3340;
    --accent:#8FA8F7; --accent-soft:#232D47; --cut:#F07A6E; --cut-soft:#3A2224;
    --ok:#6CC894; --ok-soft:#1C3326; --warn:#E0B55C; --warn-soft:#352C18;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#12151C; --surface:#1A1F29; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2C3340;
  --accent:#8FA8F7; --accent-soft:#232D47; --cut:#F07A6E; --cut-soft:#3A2224;
  --ok:#6CC894; --ok-soft:#1C3326; --warn:#E0B55C; --warn-soft:#352C18;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;padding:0 16px}
.wrap{max-width:820px;margin:0 auto;padding-block:32px 64px;display:flex;flex-direction:column;gap:20px}
header>div{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,5vw,38px);line-height:1.2;margin:0;text-wrap:balance}
h2{font:600 17px var(--sans);margin:0}
.lede{color:var(--muted);margin:0;max-width:62ch}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:16px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{appearance:none;border:0;padding:0;width:12px;height:12px;border-radius:50%;background:var(--line);cursor:pointer}
.dot.ok{background:var(--ok)} .dot.no{background:var(--cut)} .dot.done{background:var(--accent)} .dot.cur{outline:2px solid var(--accent);outline-offset:2px}
.q{font-size:18px;margin:0}
.q em,.expl em,.task em,td em{font-family:var(--serif);font-style:italic}
.task{margin:0}
.step{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.expl{border-left:3px solid var(--ok);padding:4px 0 4px 14px;margin:0;display:flex;flex-direction:column;gap:6px}
.expl.bad{border-left-color:var(--cut)}
.expl.plain{border-left-color:var(--accent)}
.expl .verdict{font-weight:600}
.hint{font-size:14px;color:var(--muted);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;font:inherit;font-weight:500;font-size:15px;border-radius:8px;padding:8px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{font-size:14px;padding:5px 12px}
.linkbtn{appearance:none;border:0;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.credit{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin:0}
code,pre{font-family:var(--mono);font-size:.92em}
details summary{cursor:pointer;font-weight:500}
details.help{font-size:15px}
details.help[open] summary{margin-bottom:8px}
details.help ul{margin:0;padding-left:20px}
table{border-collapse:collapse;font-size:14px;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-weight:600}
.tblwrap{overflow-x:auto}

/* 登入、成績上傳狀態（跟句法頁同一套） */
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.who b{color:var(--ink);font-weight:500;font-family:var(--mono)}
.sync{font-family:var(--mono);font-size:13px}
.sync .ok{color:var(--ok)} .sync .pend{color:var(--warn)}
.login{display:flex;flex-direction:column;gap:14px;max-width:420px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:14px;font-weight:500}
.field input{font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.field input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.err{color:var(--cut);font-size:14px;margin:0;min-height:1.4em}
.why{display:flex;flex-direction:column;gap:6px}
.why label{font-size:15px;font-weight:500}
textarea{font:inherit;font-size:15px;line-height:1.6;resize:vertical;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
textarea:disabled{background:var(--ground);color:var(--ink)}
.why textarea{min-height:96px}
textarea.gram{font-family:var(--mono);font-size:14px;line-height:1.55;min-height:260px;tab-size:4;white-space:pre;overflow-x:auto}
.cnt{font-family:var(--mono);font-size:12px;color:var(--muted);align-self:flex-end}
.status{font-size:14px;color:var(--warn)}
.status.ready{color:var(--ok)}

/* 文法檢查的輸出 */
.out{display:flex;flex-direction:column;gap:10px}
.msg{margin:0;padding:8px 12px;border-radius:8px;font-size:15px}
.msg.bad{background:var(--cut-soft);color:var(--ink);border-left:3px solid var(--cut)}
.msg.warn{background:var(--warn-soft);border-left:3px solid var(--warn)}
.msg.ok{background:var(--ok-soft);border-left:3px solid var(--ok)}
.msg.info{background:var(--accent-soft);border-left:3px solid var(--accent)}
.msg ul{margin:4px 0 0;padding-left:20px}
.checks{font-family:var(--mono);font-size:14px;margin:0;padding:0;list-style:none}
.checks li{padding:2px 0}
.treebox{display:flex;flex-direction:column;gap:4px}
.treebox .tlabel{font:600 14px var(--sans);color:var(--muted)}
.treewrap{overflow-x:auto;padding:8px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:center}
svg.tree{display:inline-block;overflow:visible;height:auto}
svg.tree .lab{font:600 16px var(--serif);fill:var(--ink)}
svg.tree .wd{font:italic 500 16px var(--serif);fill:var(--ink)}
svg.tree .ln{stroke:var(--muted);stroke-width:1.2;fill:none}
.br{font-size:13px;color:var(--muted);word-break:break-word}

/* 選哪棵樹 */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt input{margin:0 6px 0 0;accent-color:var(--accent)}
.opt .head{font-weight:600;display:flex;align-items:center}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--cut);background:var(--cut-soft)}
.opt.locked{cursor:default}
.opt .treewrap{border:0}
.opt svg.tree{max-width:100%}
.gl{margin:0;font-size:15px;color:var(--muted)}
.gl em{font-family:var(--serif);font-style:italic;color:var(--ink)}
pre.sample{margin:0;padding:10px 12px;background:var(--ground);border-radius:8px;overflow-x:auto;font-size:13px;line-height:1.5}
@media (max-width:480px){.card{padding:16px}.opts{grid-template-columns:1fr}}
/* 回報題目、複習自己的作答（四頁共用） */
.report{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
.report .hint{margin:0 0 6px}
.hitem{border-top:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:8px}
.hitem h3{margin:0;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.hitem .hq{margin:0}
.hatt{background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px;overflow-wrap:anywhere}
.hatt .hh{font-size:13px;color:var(--muted)}
.hatt .hh b.ok{color:var(--ok)}
.hatt .hh b.no{color:var(--cut)}
.hatt .hw{white-space:pre-wrap}
.hatt pre{margin:0;font-family:var(--mono);font-size:13px;white-space:pre-wrap}
.hitem details{font-size:14px}
.hitem summary{cursor:pointer;color:var(--accent)}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Syntax</div>
      <h1>Which tree is right?</h1>
      <p class="lede">Choose the right tree for each sentence, then argue for it with constituency tests.</p>
    </div>
  </header>
  <div class="who" id="who" hidden></div>
  <div id="stage"></div>
  <p class="credit">Some sentences adapted from Anderson et al., <em>Essentials of Linguistics</em>, 2nd ed. (CC BY-NC-SA 4.0).</p>
</div>

<script>
/* ---------- 題目 ----------
   10-12 老師：拖拉畫樹不適合評分，改成幾棵樹選一棵，再論證為什麼（拖拉版在 git 紀錄 e14cfd1 以前）。
   記法照老師的 syntax_part1–3 簡報（Fromkin 10th ed. Ch.3, Appendix C）：Det 跟 N' 在 NP 底下；T 放 ±pst 或情態動詞；
   have / be 是 V（rule 7、20）；名字和代名詞直接掛 NP。沒有情態動詞時 T 寫 +pst／–pst，動詞寫原形，跟簡報的 "The child ate" 一樣。
   opts 是候選樹（方括號寫法），ans 是對的那棵的位置（可以是陣列，表示都算對）。誘答樹挑學生最可能犯的錯。
   標準答案、誘答樹和解說是 AI 寫的，要老師核。
   題號照陣列位置編（S1-01 是 ITEMS[1]），學生開始作答後只能在最後加題，不能調換或替換。ITEMS[0] 是練習，不送成績。 */
const ITEMS = [
  { ex:"Practice", tut:true, say:"A dog barked", t:"+pst",
    opts:["[TP [NP [Det a] [N' [N dog]]] [T' [T +pst] [VP [V' [V bark]]]]]",
          "[TP [NP [Det a] [N' [N dog]]] [T +pst] [VP [V' [V bark]]]]"],
    ans:0,
    e:"This is the shape of every English sentence in this chapter. The subject NP is the specifier of TP, and T' holds T and the VP. Tree B has no T', so T and the VP are not a unit and the subject is just one of three sisters. Evidence that T and the VP go together: <em>A dog barked, and a cat did too</em>: <em>did too</em> stands in for the tense plus the VP, leaving the subject outside." },
  { ex:"Ex. 14a", say:"The children read the book", t:"+pst",
    opts:["[TP [NP [Det the] [N' [N children]]] [T' [T +pst] [VP [V' [V' [V read]] [NP [Det the] [N' [N book]]]]]]]",
          "[TP [NP [Det the] [N' [N children]]] [T' [T +pst] [VP [V' [V read] [NP [Det the] [N' [N book]]]]]]]"],
    ans:1,
    e:"<em>The book</em> is the complement of <em>read</em>, so it is a sister of V inside the same V' (rule 5). Tree A treats it as an adjunct, outside a smaller V' that holds only <em>read</em>. The <em>do so</em> test shows the difference: <em>do so</em> replaces a V', and it cannot leave a complement behind. <em>The children read the book, and the adults did so too</em> is fine, but <em>*The children read the book, and the adults did so the magazine</em> is bad. So there is no V' containing <em>read</em> without <em>the book</em>." },
  { ex:"Ex. 14c", say:"The weather is cold", t:"–pst",
    opts:["[TP [NP [Det the] [N' [N weather]]] [T' [T –pst] [VP [V' [V be] [AP [A' [A cold]]]]]]]",
          "[TP [NP [Det the] [N' [N weather]]] [T' [T –pst] [VP [V' [V' [V be]] [AP [A' [A cold]]]]]]]"],
    ans:0,
    e:"<em>Is</em> is not a modal, so T holds only the tense, –pst, and <em>be</em> is a verb (–pst and <em>be</em> are pronounced <em>is</em>). <em>Be</em> needs the AP: <em>*The weather is</em> is not a sentence. Something a verb needs is its complement, a sister of V inside V' (rule 7, V' → V AP), as in tree A. Tree B makes <em>cold</em> an optional adjunct." },
  { ex:"Ex. 14d", say:"Emily may win the race",
    opts:["[TP [NP Emily] [T' [T may] [VP [V' [V' [V win]] [NP [Det the] [N' [N race]]]]]]]",
          "[TP [NP Emily] [T' [T may] [VP [V' [V win] [NP [Det the] [N' [N race]]]]]]]"],
    ans:1,
    e:"Both trees put the modal <em>may</em> in T. The difference is <em>the race</em>. It is the complement of <em>win</em>, so it is a sister of V inside V', as in tree B. Tree A makes it an adjunct. Test with <em>do so</em>: <em>Emily may win the race, and Sue may do so too</em> works, but <em>*Emily may win the race, and Sue may do so the cup</em> does not, so no V' holds <em>win</em> without <em>the race</em>." },
  { ex:"Ex. 14e", say:"I have finished my homework", t:"–pst",
    opts:["[TP [NP I] [T' [T –pst] [VP [V' [V have] [V finished] [NP [Det my] [N' [N homework]]]]]]]",
          "[TP [NP I] [T' [T –pst] [VP [V' [V have] [VP [V' [V finished] [NP [Det my] [N' [N homework]]]]]]]]]"],
    ans:1,
    e:"<em>Have</em> is not a modal, so T holds the tense (–pst) and <em>have</em> is a verb. Its complement is another VP, <em>finished my homework</em> (rule 20, V' → V VP), as in tree B. Tree A has no node for <em>finished my homework</em>, but it is a constituent. Coordination: <em>I have finished my homework and cleaned my room</em>. Ellipsis: <em>I have finished my homework, and Sue has too</em>, where <em>has</em> stands for <em>has finished her homework</em>." },
  { ex:"Class practice", say:"Every girl read some poetry", t:"+pst",
    opts:["[TP [NP [Det every] [N' [N girl]]] [T' [T +pst] [VP [V' [V read] [NP [Det some] [N' [N poetry]]]]]]]",
          "[TP [NP [Det every] [N' [N girl]]] [T' [T +pst] [VP [V' [V read] [Det some] [N' [N poetry]]]]]]"],
    ans:0,
    e:"<em>Some poetry</em> is one NP, the object, just like <em>every girl</em> is one NP, the subject. Tree B leaves <em>some</em> and <em>poetry</em> as two separate sisters of V. Tests: <em>Every girl read it</em> (<em>it</em> = some poetry); <em>What did every girl read? Some poetry.</em>; <em>Every girl read some poetry and a novel.</em> Each treats <em>some poetry</em> as a unit, so it needs its own NP node (rules 2 and 3)." },
  { ex:"Class example", say:"A hyena laughed at me", t:"+pst",
    opts:["[TP [NP [Det a] [N' [N hyena]]] [T' [T +pst] [VP [V' [V laugh] [P at] [NP me]]]]]",
          "[TP [NP [Det a] [N' [N hyena]]] [T' [T +pst] [VP [V' [V laugh] [PP [P' [P at] [NP me]]]]]]]"],
    ans:1,
    e:"<em>At me</em> is a constituent, a PP, so it needs its own node (rules 9 and 10), as in tree B. Movement: <em>At me, a hyena laughed</em> (not at you). Question: <em>Who did the hyena laugh at? At me.</em> In tree A, <em>at</em> and <em>me</em> are separate sisters of V, so nothing in the tree groups them. The PP is the complement of <em>laugh</em> (rule 6, V' → V PP)." },
  { ex:"Class example", say:"The girl may cry",
    opts:["[TP [NP [Det the] [N' [N girl]]] [T' [T may] [VP [V' [V cry]]]]]",
          "[TP [NP [Det the] [N' [N girl]]] [VP [V' [V may] [VP [V' [V cry]]]]]]"],
    ans:0,
    e:"<em>May</em> is a modal, so it sits in T, as in tree A. Tree B treats it as a verb like <em>have</em>. Modals behave differently from verbs: they never take <em>-s</em> (<em>*The girl mays cry</em>), they come before <em>not</em> (<em>The girl may not cry</em>), and they move in questions (<em>May the girl cry?</em>). Those are the properties of T. <em>Cry</em> takes no complement, but the VP still has all three levels (rule 4, V' → V)." },
  { ex:"Ambiguity", say:"I saw the man with the telescope", mean:"the man has the telescope", t:"+pst",
    opts:["[TP [NP I] [T' [T +pst] [VP [V' [V see] [NP [Det the] [N' [N' [N man]] [PP [P' [P with] [NP [Det the] [N' [N telescope]]]]]]]]]]]",
          "[TP [NP I] [T' [T +pst] [VP [V' [V' [V see] [NP [Det the] [N' [N man]]]] [PP [P' [P with] [NP [Det the] [N' [N telescope]]]]]]]]]"],
    ans:0,
    e:"On this meaning <em>with the telescope</em> describes the man, so the PP is inside the object NP, an adjunct to N' (rule 17, N' → N' PP), as in tree A. Substitution: <em>I saw him</em>, with <em>him</em> = the man with the telescope. Question: <em>Who did you see? The man with the telescope.</em> Tree B is the other meaning." },
  { ex:"Ambiguity", say:"I saw the man with the telescope", mean:"I used the telescope to see the man", t:"+pst",
    opts:["[TP [NP I] [T' [T +pst] [VP [V' [V see] [NP [Det the] [N' [N' [N man]] [PP [P' [P with] [NP [Det the] [N' [N telescope]]]]]]]]]]]",
          "[TP [NP I] [T' [T +pst] [VP [V' [V' [V see] [NP [Det the] [N' [N man]]]] [PP [P' [P with] [NP [Det the] [N' [N telescope]]]]]]]]]"],
    ans:1,
    e:"On this meaning <em>with the telescope</em> describes the seeing, so the PP is an adjunct to V' (rule 16, V' → V' PP), as in tree B. Substitution: <em>I saw him with the telescope</em>, with <em>him</em> = the man. <em>Do so</em>: <em>I saw the man with the telescope, and Sue did so with binoculars</em>, where <em>did so</em> replaces <em>saw the man</em>, the lower V'. Same words in the same order, but the PP is a sister of a different node, so the tree and the meaning are different." },
];
const QUESTION = it => `Which tree is right for <em>${esc(it.say)}</em>${it.mean ? ` on the meaning “${esc(it.mean)}”` : ""}?${it.t ? ` <span class="hint">There is no modal, so T holds the tense (<b style="white-space:nowrap">${esc(it.t)}</b>) and the verb is written in its base form, as in class.</span>` : ""}`;
const HELP = `<details class="help"><summary>Constituency tests</summary><div class="tblwrap"><table>
  <tr><th>Test</th><th>What you do</th><th>Example</th></tr>
  <tr><td>Substitution</td><td>Replace the string with <em>it, she, him, there, do so</em></td><td><em>the man with the telescope</em> → <em>him</em></td></tr>
  <tr><td>Movement</td><td>Move the string to the front of the sentence</td><td><em>At me, a hyena laughed.</em></td></tr>
  <tr><td>Question</td><td>Ask a question; the string can be the short answer</td><td><em>What did every girl read? Some poetry.</em></td></tr>
  <tr><td>Coordination</td><td>Join the string with another of the same kind using <em>and</em></td><td><em>finished my homework and cleaned my room</em></td></tr>
  </table></div><p class="hint">A string that passes these tests is a constituent, so it is one node in the tree. <em>Do so</em> replaces a V' and must include the verb's complement.</p></details>`;
const WHY_LABEL = "Argue for your choice. Use at least one constituency test, or other evidence from the sentence.";
const WHY_PH = "For example: I can replace … with “it”, so … is one constituent.";
const WHY_MIN = 20, WHY_MAX = 800;
const ENDPOINT = "__ENDPOINT__";
const QUIZ_ID = "ch02_syntax";

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad2 = n => String(n).padStart(2, "0");
const okSet = it => Array.isArray(it.ans) ? it.ans : [it.ans];
const L = "ABC";

/* ---------- 樹：方括號寫法 → {l, k}，詞是 {w} ---------- */
function fromBracket(s){
  const tk = s.replace(/\[/g, " ( ").replace(/\]/g, " ) ").trim().split(/\s+/); let p = 0;
  function node(){ p++; const n = {l:tk[p++], k:[]}; while(tk[p] !== ")"){ n.k.push(tk[p] === "(" ? node() : {w:tk[p++]}); } p++; return n; }
  return node();
}
function bracket(n){ return n.w !== undefined ? n.w : `[${n.l} ${n.k.map(bracket).join(" ")}]`; }

const ctx = document.createElement("canvas").getContext("2d");
const LF = '600 16px "IBM Plex Serif", Georgia, serif', WF = 'italic 500 16px "IBM Plex Serif", Georgia, serif';
const tw = (s, f) => { ctx.font = f; return ctx.measureText(s).width; };
function draw(root, label){
  const DY = 54, TOP = 20; let x = 0, maxY = 0, g = "";
  (function lay(n, d, parent){
    if(n.w !== undefined){
      const only = parent.k.length === 1;
      const cw = Math.max(tw(n.w, WF) + 16, only ? tw(parent.l, LF) + 24 : 0, 40);
      n.y = only ? parent.y + 28 : TOP + d*DY;
      n.x = x + cw/2; x += cw; maxY = Math.max(maxY, n.y); return;
    }
    n.y = TOP + d*DY;
    n.k.forEach(c => lay(c, d+1, n));
    n.x = (n.k[0].x + n.k[n.k.length-1].x)/2;
  })(root, 0, null);
  (function walk(n){
    if(n.w !== undefined){ g += `<text class="wd" x="${n.x}" y="${n.y}" text-anchor="middle">${esc(n.w)}</text>`; return; }
    n.k.forEach(c => { g += `<line class="ln" x1="${n.x}" y1="${n.y+7}" x2="${c.x}" y2="${c.y-17}"/>`; walk(c); });
    g += `<text class="lab" x="${n.x}" y="${n.y}" text-anchor="middle">${esc(n.l)}</text>`;
  })(root);
  const W = Math.ceil(x + 8), H = Math.ceil(maxY + 10);
  return `<svg class="tree" viewBox="-4 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(label || bracket(root))}">${g}</svg>`;
}

/* ---------- 學生登入與成績記錄（各頁同一套，各記在自己的 Sheet） ----------
   build_site.py 會把 __ENDPOINT__ 換成這一章的 Apps Script 網址；沒換就只存在本機。
   各頁在同一個網域，localStorage 共用：學生資料（ling_student）共用，上傳佇列一定要帶 quiz id 分開。
   進度的 key 用 v2：拖拉版（v1）存的是畫布狀態，跟選擇題對不上。 */
const ONLINE = /^https:\/\//.test(ENDPOINT);
const QKEY = `ling_queue_${QUIZ_ID}`, DLKEY = `ling_deadletter_${QUIZ_ID}`;
const URL_MAX = 6000;
const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let student = LS.get("ling_student", null);
const progKey = () => `ling_prog_v2_${QUIZ_ID}_${student.sid}`;
const fresh = () => ({choice:null, why:"", done:false, ok:null, attempt:1});
let S = ITEMS.map(fresh), cur = 0;
function saveProg(){ if(student) LS.set(progKey(), {v:2, cur, items:S}); }
function loadProg(){
  S = ITEMS.map(fresh); cur = 0;
  const p = LS.get(progKey(), null);
  if(!p || p.v !== 2 || !Array.isArray(p.items)) return;
  p.items.forEach((x, k) => { if(k < S.length && x && typeof x.why === "string") Object.assign(S[k], x); });
  cur = Math.min(Math.max(0, p.cur|0), ITEMS.length - 1);
}

let seq = 0;
const urlLen = p => ENDPOINT.length + 40 + encodeURIComponent(JSON.stringify(p)).length;
function record(level, qid, prompt, response, correct, attempt, reasoning){
  const t = Date.now();
  const p = {event_id:`${student.sid}|${QUIZ_ID}|${qid}|${attempt}|${t}-${seq++}`,
    client_time:new Date(t).toISOString(), quiz:QUIZ_ID, student_id:student.sid, name:student.name,
    part:"S", level, qid, prompt:prompt.slice(0,120), response:response.slice(0,300),
    correct: correct===null ? "" : (correct?1:0), attempt, reasoning};
  while(urlLen(p) > URL_MAX && p.reasoning.length > 0){ p.reasoning = p.reasoning.slice(0, Math.floor(p.reasoning.length*0.8)); p.truncated = 1; }
  if(!ONLINE) return null;
  const q = LS.get(QKEY, []); q.push(p); LS.set(QKEY, q);
  flush();
  return p.event_id;
}
function jsonp(p, ms=15000){
  return new Promise((res,rej)=>{
    const cb = "cb_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const t = setTimeout(()=>{cleanup();rej({server:false,error:"timeout"})}, ms);
    function cleanup(){clearTimeout(t);delete window[cb];s.remove()}
    window[cb] = r => {cleanup(); if(r&&r.ok) res(r); else rej({server:!(r&&r.retry), error:(r&&r.error)||"rejected"}); };
    s.onerror = () => {cleanup();rej({server:false,error:"network"})};
    s.src = ENDPOINT + "?callback=" + cb + "&data=" + encodeURIComponent(JSON.stringify(p));
    document.body.appendChild(s);
  });
}
let flushing = false, misconfig = false;
async function flush(){
  if(!ONLINE || flushing) return;
  flushing = true; renderSync();
  let q = LS.get(QKEY, []);
  while(q.length){
    const sent = q[0];
    try{ await jsonp(sent); misconfig = false; }
    catch(e){
      if(e && e.error === "unknown quiz"){ misconfig = true; break; }
      if(e && e.server){ const dl = LS.get(DLKEY, []); dl.push({payload:sent, error:e.error}); LS.set(DLKEY, dl); }
      else break;
    }
    q = LS.get(QKEY, []).filter(x => x.event_id !== sent.event_id); LS.set(QKEY, q);
  }
  flushing = false; renderSync();
}
function renderSync(){
  const el = document.getElementById("sync"); if(!el) return;
  if(!ONLINE){ el.innerHTML = '<span class="pend">Saved on this device only</span>'; return; }
  const n = LS.get(QKEY, []).length, dl = LS.get(DLKEY, []).length;
  let s = misconfig ? `<span class="pend">The grade sheet is not ready yet. Your ${n} answer(s) are kept on this device and will be sent later. Please tell your TA.</span>`
    : n ? `<span class="pend">Uploading, ${n} left</span>` : '<span class="ok">Answers recorded</span>';
  if(dl) s += ` <span class="pend">${dl} answer(s) were not accepted. Please tell your TA.</span>`;
  el.innerHTML = s;
}
function renderWho(){
  const el = document.getElementById("who");
  if(!student){ el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<span>Signed in as <b>${esc(student.sid)}</b> ${esc(student.name)} · <button class="linkbtn" id="logout">Switch student</button></span><span class="sync" id="sync"></span>`;
  document.getElementById("logout").onclick = () => { student = null; LS.set("ling_student", null); S = ITEMS.map(fresh); cur = 0; renderWho(); route(); };
  renderSync();
}
function renderLogin(){
  stage.innerHTML = `<section class="card"><form class="login" id="login" novalidate>
    <p class="q">Enter your student ID and name to begin.</p>
    <div class="field"><label for="sid">Student ID</label><input id="sid" autocomplete="off" placeholder="e.g. B13012345" maxlength="9"></div>
    <div class="field"><label for="sname">Name</label><input id="sname" autocomplete="name" maxlength="30"></div>
    <p class="err" id="lerr"></p>
    <div><button class="btn primary" type="submit">Start</button></div></form></section>`;
  document.getElementById("login").onsubmit = e => {
    e.preventDefault();
    const sid = document.getElementById("sid").value.trim().toUpperCase();
    const nm = document.getElementById("sname").value.trim();
    const err = document.getElementById("lerr");
    if(!/^[A-Z][0-9]{8}$/.test(sid)){ err.textContent = "A student ID is one letter followed by 8 digits, e.g. B13012345."; return; }
    if(!nm){ err.textContent = "Please enter your name."; return; }
    student = {sid, name:nm}; LS.set("ling_student", student);
    loadProg(); renderWho(); route();
  };
}
function route(){ if(!student){ renderLogin(); return; } render(); }

/* ---------- 頁面：每題幾棵樹選一棵，再寫論證；論證寫完才能送出，送出後才看得到解說 ---------- */
const stage = document.getElementById("stage");
const scoredN = ITEMS.filter(it => !it.tut).length;
function render(){
  const it = ITEMS[cur], st = S[cur], good = okSet(it);
  const dots = ITEMS.map((x, k) => `<button class="dot ${S[k].ok===true?"ok":S[k].ok===false?"no":S[k].done?"done":""} ${k===cur?"cur":""}" data-go="${k}" aria-label="${esc(x.ex)}"></button>`).join("");
  const score = S.filter((s, k) => !ITEMS[k].tut && s.ok === true).length;
  const opts = it.opts.map((b, k) => {
    const cls = st.done ? (good.includes(k) ? "right" : k === st.choice ? "wrong" : "") : st.choice === k ? "sel" : "";
    return `<label class="opt ${cls} ${st.done ? "locked" : ""}"><span class="head"><input type="radio" name="pick" value="${k}" ${st.choice === k ? "checked" : ""} ${st.done ? "disabled" : ""}>Tree ${L[k]}</span><div class="treewrap">${draw(fromBracket(b), `Tree ${L[k]}`)}</div></label>`;
  }).join("");
  stage.innerHTML = `<section class="card">
    <div class="meta"><span>${it.tut ? "Practice · not scored" : `${esc(it.ex)} · Question ${cur} of ${ITEMS.length-1} · Score ${score}/${scoredN}`}</span><div class="dots">${dots}</div></div>
    <p class="q">${QUESTION(it)}</p>
    ${it.gl ? `<p class="gl">${it.gl}</p>` : ""}
    ${HELP}
    <div class="opts" id="opts">${opts}</div>
    <div class="why"><label for="why">${WHY_LABEL}</label>
      <textarea id="why" maxlength="${WHY_MAX}" placeholder="${esc(WHY_PH)}" ${st.done ? "disabled" : ""}></textarea>
      <span class="cnt" id="cnt"></span></div>
    <div class="row"><div class="btns">${st.done ? `<button class="btn" id="again">Try again</button>` : ""}</div>
      <div class="btns"><span class="status" id="need"></span>${st.done ? "" : `<button class="btn primary" id="submit">Submit</button>`}</div></div>
    <div id="result"></div>
    ${reportHTML()}
    <div class="row"><div class="btns"><button class="btn" id="prev" ${cur?"":"disabled"}>Previous</button></div>
      <div class="btns"><button class="btn primary" id="next" ${cur<ITEMS.length-1?"":"disabled"}>Next</button></div></div>
  </section>`;
  const $ = q => stage.querySelector(q);
  stage.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { cur = +b.dataset.go; go(); });
  const why = $("#why");
  why.value = st.why || "";
  const status = () => {
    const len = (st.why || "").trim().length;
    $("#cnt").textContent = `${len}/${WHY_MAX}`;
    const n = $("#need");
    if(st.done){ n.textContent = ""; return; }
    const msg = st.choice === null ? "Choose a tree." : len < WHY_MIN ? `Write your argument (at least ${WHY_MIN} characters).` : "";
    n.textContent = msg || "Ready to submit."; n.className = "status" + (msg ? "" : " ready");
    $("#submit").disabled = !!msg;
  };
  why.oninput = () => { st.why = why.value; saveProg(); status(); };
  stage.querySelectorAll('input[name="pick"]').forEach(r => r.onchange = () => {
    st.choice = +r.value; saveProg();
    stage.querySelectorAll(".opt").forEach((o, k) => o.classList.toggle("sel", k === st.choice));
    status();
  });
  status();
  if($("#submit")) $("#submit").onclick = () => {
    if(st.choice === null || st.why.trim().length < WHY_MIN) return;
    st.why = st.why.trim(); st.ok = good.includes(st.choice); st.done = true;
    if(!it.tut) record(1, `S1-${pad2(cur)}`, it.mean ? `${it.say} (${it.mean})` : it.say, `Tree ${L[st.choice]}: ${bracket(fromBracket(it.opts[st.choice]))}`, st.ok, st.attempt, st.why);
    saveProg(); render();
  };
  if($("#again")) $("#again").onclick = () => { st.done = false; st.ok = null; st.choice = null; st.why = ""; st.attempt = (st.attempt || 1) + 1; saveProg(); render(); };
  if(st.done) $("#result").innerHTML = `<div class="expl ${st.ok ? "" : "bad"}"><span class="verdict">${st.ok ? "Correct" : "Not quite"}${good.length > 1 ? ` · Trees ${good.map(k => L[k]).join(" and ")} are both accepted` : ` · Tree ${L[good[0]]} is right`}</span><span>${it.e}</span></div>`;
  mountReport(stage, {qid: it.tut ? "practice" : `S1-${pad2(cur)}`, prompt: it.mean ? `${it.say} (${it.mean})` : it.say,
    response: st.done ? `Tree ${L[st.choice]}` : "", attempt: st.attempt});
  $("#prev").onclick = () => { cur--; go(); };
  $("#next").onclick = () => { cur++; go(); };
}
function go(){ saveProg(); render(); stage.scrollIntoView({block:"start"}); }

/* ---------- 回報題目有問題、複習自己的作答（四頁共用同一段，改的時候四頁一起改） ----------
   回報送到後端 action=report，記在該章 Sheet 的 reports 分頁。複習用 action=history 把這個學號的作答紀錄抓回來，
   換裝置或清掉瀏覽器也看得到；只列出來看，不還原成可作答的狀態。各頁自己定義 histItem(qid) 告訴這段題目長什麼樣。 */
const RPKEY = () => `ling_reported_${QUIZ_ID}_${student.sid}`;
const reportHTML = () => ONLINE ? '<div class="report" data-report></div>' : "";
function mountReport(root, info){   // info: {qid, prompt, response, attempt}
  const box = root.querySelector("[data-report]"); if(!box || !student) return;
  const sent = LS.get(RPKEY(), {})[info.qid];
  box.innerHTML = `${sent ? '<p class="hint">Thanks. Your TA will check this question.</p>' : ""}<button class="linkbtn" data-open>${sent ? "Report another problem" : "Something wrong with this question? Tell your TA"}</button>`;
  box.querySelector("[data-open]").onclick = () => {
    box.innerHTML = `<div class="why"><label for="rnote">What is wrong? For example, a typo, an unclear question, or an answer you think is marked wrong.</label>
      <textarea id="rnote" maxlength="500"></textarea>
      <div class="row"><div class="btns"><button class="btn" data-cancel>Cancel</button></div><div class="btns"><button class="btn primary" data-send>Send to TA</button></div></div></div>`;
    const note = box.querySelector("#rnote"), send = box.querySelector("[data-send]");
    note.focus();
    box.querySelector("[data-cancel]").onclick = () => mountReport(root, info);
    send.onclick = async () => {
      const n = note.value.trim(); if(!n){ note.focus(); return; }
      send.disabled = true; send.textContent = "Sending…";
      const p = {action:"report", event_id:`${student.sid}|${QUIZ_ID}|${info.qid}|report|${Date.now()}`, quiz:QUIZ_ID,
        student_id:student.sid, name:student.name, qid:info.qid, attempt:info.attempt || "",
        prompt:String(info.prompt || "").slice(0,200), response:String(info.response || "").slice(0,200), note:n};
      try{ await jsonp(p); const r = LS.get(RPKEY(), {}); r[info.qid] = (r[info.qid] || 0) + 1; LS.set(RPKEY(), r); mountReport(root, info); }
      catch(e){ send.disabled = false; send.textContent = "Couldn't send. Try again"; }
    };
  };
}
async function showHistory(){
  if(typeof levelsEl !== "undefined") levelsEl.hidden = true;
  stage.innerHTML = `<section class="card"><div class="meta"><span>My answers</span></div>
    <p class="hint" id="hstat">Loading your answers…</p><div id="hlist"></div>
    <div class="row"><div class="btns"><button class="btn primary" id="hback">Back to practice</button></div></div></section>`;
  stage.querySelector("#hback").onclick = () => route();
  stage.scrollIntoView({block:"start"});
  let rows;
  try{ rows = (await jsonp({action:"history", quiz:QUIZ_ID, student_id:student.sid}, 30000)).rows || []; }
  catch(e){ const s = document.getElementById("hstat"); if(s) s.textContent = "Couldn't load your answers. Check your connection and try again."; return; }
  const list = document.getElementById("hlist"); if(!list) return;   // 載入時已經按了返回
  const by = {};
  rows.forEach(r => { const h = histItem(r.qid); if(h) (by[r.qid] = by[r.qid] || {h, at:[]}).at.push(r); });
  const qs = Object.keys(by).sort((a, b) => by[a].h.order - by[b].h.order);
  const pending = LS.get(QKEY, []).length;
  document.getElementById("hstat").textContent = (qs.length ? `Your answers to ${qs.length} question(s), from the grade sheet. Your first attempt at each question is the one that counts.` : "No answers recorded yet for this student ID.")
    + (pending ? ` ${pending} answer(s) from this device are still uploading and will show up after they are sent.` : "");
  list.innerHTML = qs.map(q => { const {h, at} = by[q];
    return `<div class="hitem"><h3>${h.title}</h3><p class="hq">${h.q}</p>
      ${at.map((r, k) => `<div class="hatt"><span class="hh">Attempt ${k+1} · ${r.correct === "" ? "<b>Submitted</b>" : r.correct ? '<b class="ok">Correct</b>' : '<b class="no">Incorrect</b>'}${r.t ? " · " + esc(new Date(r.t).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})) : ""}</span>
        ${r.response ? `<span>${esc(h.respLabel || "Your answer")}: ${esc(r.response)}</span>` : ""}
        ${r.reasoning ? (h.pre ? `<span>${esc(h.whyLabel || "Your reasoning")}:</span><pre>${esc(r.reasoning)}</pre>` : `<span class="hw">${esc(h.whyLabel || "Your reasoning")}: ${esc(r.reasoning)}</span>`) : ""}</div>`).join("")}
      ${h.expl ? `<details><summary>Explanation</summary><div class="expl plain">${h.expl}</div></details>` : ""}</div>`; }).join("");
}
function histItem(qid){   // S1-xx 的 xx 是 ITEMS 的位置（0 是練習題，不送）
  const m = /^S1-(\d+)$/.exec(qid), it = m && ITEMS[+m[1]];
  if(!it || it.tut) return null;
  const good = okSet(it);
  return {order:+m[1], title:esc(it.ex), q:QUESTION(it), whyLabel:"Your argument",
    expl:`<span class="verdict">${good.length > 1 ? `Trees ${good.map(k => L[k]).join(" and ")} are both accepted` : `Tree ${L[good[0]]} is right`}</span><span>${it.e}</span>`};
}
const renderWhoBase = renderWho;
renderWho = function(){   // 在「Signed in as …」那一行加 My answers
  renderWhoBase();
  if(!student || !ONLINE) return;
  const sp = document.querySelector("#who > span"); if(!sp) return;
  sp.insertAdjacentHTML("beforeend", ' · <button class="linkbtn" id="hist">My answers</button>');
  document.getElementById("hist").onclick = showHistory;
};

if(student) loadProg();
renderWho(); route();
flush(); setInterval(flush, 20000);
window.addEventListener("online", flush);
document.fonts?.ready.then(() => { if(student && !document.getElementById("hlist")) render(); });   // 字型載入後重量字寬
</script>
