<title>Syntax Practice (prototype)</title>

<style>
:root{
  --ground:#F2F4F7; --surface:#FFFFFF; --ink:#1B2230; --muted:#5B6475; --line:#D9DEE7;
  --accent:#2F5BD3; --accent-soft:#E4EBFB; --cut:#D2463A; --cut-soft:#FBE7E4;
  --ok:#2E7D4F; --ok-soft:#E2F2E8; --warn:#9A6A12; --warn-soft:#F7EED9;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --serif:"IBM Plex Serif",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#12151C; --surface:#1A1F29; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2C3340;
    --accent:#8FA8F7; --accent-soft:#232D47; --cut:#F07A6E; --cut-soft:#3A2224;
    --ok:#6CC894; --ok-soft:#1C3326; --warn:#E0B55C; --warn-soft:#352C18;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#12151C; --surface:#1A1F29; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2C3340;
  --accent:#8FA8F7; --accent-soft:#232D47; --cut:#F07A6E; --cut-soft:#3A2224;
  --ok:#6CC894; --ok-soft:#1C3326; --warn:#E0B55C; --warn-soft:#352C18;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;padding:0 16px}
.wrap{max-width:760px;margin:0 auto;padding-block:32px 64px;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,5vw,38px);line-height:1.2;margin:0;text-wrap:balance}
h1 .plus{color:var(--cut);font-family:var(--mono);font-weight:500;padding:0 .12em}
.lede{color:var(--muted);margin:0;max-width:62ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab .score{font-family:var(--mono);font-size:13px;margin-left:6px;color:var(--muted);font-variant-numeric:tabular-nums}
.levels{display:flex;gap:8px;flex-wrap:wrap}
.lv{appearance:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.lv[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:18px}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)} .dot.no{background:var(--cut)} .dot.cur{outline:2px solid var(--accent);outline-offset:1px}
.q{font-size:18px;margin:0}
.q em,.expl em{font-family:var(--serif);font-style:italic}
.data{font-family:var(--mono);font-size:14px;background:var(--ground);border-radius:6px;padding:10px 14px;overflow-x:auto;white-space:pre;line-height:1.7}
.opts{display:grid;gap:8px}
.opt{appearance:none;text-align:left;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-size:13px;color:var(--muted)}
.opt.seg{font-family:var(--mono);font-size:17px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--cut);background:var(--cut-soft)}
.opt:disabled{cursor:default}
.expl{border-left:3px solid var(--ok);padding:4px 0 4px 14px;margin:0;display:flex;flex-direction:column;gap:6px}
.expl.bad{border-left-color:var(--cut)}
.expl .verdict{font-weight:600}
.expl .src{font-size:13px;color:var(--muted)}
.gloss{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.gm{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 10px;min-width:48px}
.gm b{font-family:var(--mono);font-weight:600;font-size:16px}
.gm span{font-size:12px;color:var(--muted);text-align:center;line-height:1.35}
.gplus{align-self:center;color:var(--cut);font-family:var(--mono)}
.cutter{overflow-x:auto;padding-block:8px}
.word{display:inline-flex;align-items:stretch;font-family:var(--mono);font-size:clamp(24px,6vw,36px);font-weight:500;user-select:none}
.ch{padding:4px 0;line-height:1.3}
.gap{appearance:none;border:0;background:none;width:14px;padding:0;cursor:pointer;position:relative;color:inherit}
.gap::after{content:"";position:absolute;left:6px;top:14%;bottom:14%;width:2px;border-radius:1px;background:transparent}
.gap:hover::after{background:var(--line)}
.gap.on::after{background:var(--cut)}
.gap.miss::after{background:transparent;border-left:2px dashed var(--ok);width:0}
.gap.extra::after{background:var(--cut);opacity:.35}
.gap:disabled{cursor:default}
.hint{font-size:14px;color:var(--muted);margin:0}
.readout{font-family:var(--mono);font-size:15px;color:var(--muted);min-height:1.5em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;font:inherit;font-weight:500;font-size:15px;border-radius:8px;padding:8px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--cut);vertical-align:middle;margin-right:6px}
.legend i.m{border-top:2px dashed var(--ok)}
.done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.done .big{font-family:var(--serif);font-size:40px;font-weight:600;font-variant-numeric:tabular-nums}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.who b{color:var(--ink);font-weight:500;font-family:var(--mono)}
.linkbtn{appearance:none;border:0;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.sync{font-family:var(--mono);font-size:13px}
.sync .ok{color:var(--ok)} .sync .pend{color:var(--warn)}
.login{display:flex;flex-direction:column;gap:14px;max-width:420px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:14px;font-weight:500}
.field input{font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.err{color:var(--cut);font-size:14px;margin:0;min-height:1.4em}
@media (prefers-reduced-motion:no-preference){.expl{animation:fade .2s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
@media (max-width:480px){.card{padding:18px}}
.why{display:flex;flex-direction:column;gap:6px}

.why textarea:focus-visible,.fill input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.why textarea:disabled,.fill input:disabled{background:var(--ground);color:var(--ink)}
.why .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);align-self:flex-end}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .box{font-family:var(--mono);font-size:14px;color:var(--muted);min-width:1.2em}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.fill{display:flex;flex-direction:column;gap:8px}
.fill input{font-family:var(--mono);font-size:18px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:420px}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.key{appearance:none;font-family:var(--mono);font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:2px 12px;cursor:pointer}
.dot.sub{background:var(--muted)}
.credit{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.credit a{color:var(--muted)}
.ai{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--ground);display:flex;flex-direction:column;gap:8px}
.ai-h{font-size:14px;font-weight:600}
.ai-t{margin:0;white-space:pre-wrap}
.ai-t.wait{color:var(--muted)}
.ai-note{margin:0;font-size:13px;color:var(--muted)}
.ai textarea{font:inherit;font-size:14px;min-height:64px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}

.treewrap{overflow-x:auto;padding:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:80px;text-align:center}
svg.tree{display:inline-block;font-family:var(--serif);font-size:16px;color:var(--ink)}
svg.tree text{fill:var(--ink);pointer-events:none}
svg.tree .wd{font-style:italic}
svg.tree .ln{stroke:var(--muted);stroke-width:1.3;fill:none}
svg.tree polygon.ln{fill:none}
svg.tree .hit{fill:transparent;stroke:transparent;stroke-width:1.5;cursor:pointer;pointer-events:all}
svg.tree .hit:hover{stroke:var(--line)}
svg.tree .hit.sel{stroke:var(--accent);fill:var(--accent-soft);fill-opacity:.6}
svg.tree .nd.bad text{fill:var(--cut);font-weight:600}
.palette{display:flex;flex-direction:column;gap:8px}
.pgrp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pname{font-size:12px;font-family:var(--mono);color:var(--muted);min-width:120px}
.key:disabled{opacity:.4;cursor:default}
details summary{cursor:pointer;font-weight:500;margin-bottom:8px}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Syntax · prototype</div>
    <h1>Build the tree</h1>
    <p class="lede">Turn a sentence into a tree the way the textbook does: label each word, then join pieces from the bottom up.</p>
  </header>
  <div id="stage"></div>
  <p class="credit">Prototype. Trees follow the X-bar / TP notation of Anderson et al., <em>Essentials of Linguistics</em>, 2nd ed. (CC BY-NC-SA 4.0).</p>
</div>

<script>
/* ---------- 題目 ----------
   key 用括號寫法：[標籤 子…]，最底下的詞直接寫在標籤後面。$ 代表句中沒有發音的時態（[–PAST]）。
   alts 是也算對的其他分析。判分比對「標籤+涵蓋的詞範圍」的集合，不比對字串。 */
const ITEMS = [
  { ex:"Ex. 14a", words:["the","children","$","read","the","book"],
    key:"[TP [NP [DP the] [N' [N children]]] [T' [T $] [VP [V' [V read] [NP [DP the] [N' [N book]]]]]]]",
    e:"The subject <em>the children</em> is an NP: the determiner sits in the specifier position (DP, drawn with a triangle) and the noun is inside N'. There is no auxiliary, so T holds the abstract tense feature. T' joins T and the VP. The VP always has a V' inside it, and <em>the book</em> is the verb's complement." },
  { ex:"Ex. 14c", words:["the","weather","is","cold"],
    key:"[TP [NP [DP the] [N' [N weather]]] [T' [T is] [AP [A' [A cold]]]]]",
    e:"<em>Is</em> is a non-modal auxiliary (a form of <em>be</em>), so it is a T. Its complement is the adjective phrase <em>cold</em>, and every phrase has a bar level, so AP contains A'." },
  { ex:"Ex. 14d", words:["Emily","may","win","the","race"],
    key:"[TP [NP [N' [N Emily]]] [T' [T may] [VP [V' [V win] [NP [DP the] [N' [N race]]]]]]]",
    e:"<em>May</em> is a modal, so it is a T and heads the TP. Even a lone name gets a full NP with an N' inside it. <em>Win</em> takes <em>the race</em> as its complement, inside V'." },
  { ex:"Ex. 14e", words:["I","have","finished","my","homework"],
    key:"[TP [NP [N' [N I]]] [T' [T have] [VP [V' [V finished] [NP [DP my] [N' [N homework]]]]]]]",
    e:"<em>Have</em> is a non-modal auxiliary, so it is a T and <em>finished</em> is the main verb inside VP. <em>My</em> is a determiner in the specifier of the NP <em>my homework</em>." },
];
const HEADS=["N","V","T","A","P","DP"], BARS=["N'","V'","T'","A'","P'"], PHR=["NP","VP","TP","AP","PP"];

/* ---------- 樹的資料結構與括號解析 ---------- */
function parseKey(str, words){
  const tk = str.match(/\[|\]|[^\s\[\]]+/g); let p = 0, leaf = 0;
  function node(){
    p++;                                   // [
    const l = tk[p++], n = {l, k:[]};
    while(tk[p] !== "]"){
      if(tk[p] === "[") n.k.push(node());
      else { n.k.push({w:tk[p++], i:leaf++}); }
    }
    p++; return n;                         // ]
  }
  const t = node();
  if(leaf !== words.length) console.warn("key/word count mismatch", str);
  return t;
}
function span(n){ if(n.w !== undefined){ n.s = n.e = n.i; } else { n.k.forEach(span); n.s = Math.min(...n.k.map(c=>c.s)); n.e = Math.max(...n.k.map(c=>c.e)); } }
function sigs(n, out=new Set()){ if(n.l){ n.sig = n.l+"|"+n.s+"|"+n.e; out.add(n.sig); n.k.forEach(c=>sigs(c,out)); } return out; }
const shown = w => w === "$" ? "[–PAST]" : w;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clone = x => JSON.parse(JSON.stringify(x));
ITEMS.forEach(it => { it.tree = parseKey(it.key, it.words); span(it.tree); it.sigs = sigs(it.tree); });

/* ---------- 畫樹（SVG）。roots 是一排樹；點根節點可選取 ---------- */
function drawForest(roots, words, o={}){
  const colW = words.map(w => Math.max(64, shown(w).length*10 + 24));
  const cx = []; let acc = 0; colW.forEach(w => { cx.push(acc + w/2); acc += w; });
  const DY = 46, TOP = 22; let maxD = 0;
  function lay(n, d){ n.y = TOP + d*DY; maxD = Math.max(maxD, d);
    if(n.w !== undefined){ n.x = cx[n.i]; return; }
    n.k.forEach(c => lay(c, d+1)); n.x = n.k.reduce((a,c)=>a+c.x, 0)/n.k.length; }
  roots.forEach(r => { span(r); sigs(r); lay(r, 0); });
  let g = "";
  function walk(n, ri, isRoot){
    if(n.w !== undefined){
      const bare = isRoot;
      g += `<text class="wd ${bare?"pick":""}" x="${n.x}" y="${n.y+5}" text-anchor="middle" ${bare?`data-r="${ri}"`:""}>${esc(shown(n.w))}</text>`;
      if(bare) g += `<rect class="hit ${o.sel&&o.sel.includes(ri)?"sel":""}" x="${n.x-colW[n.i]/2+4}" y="${n.y-15}" width="${colW[n.i]-8}" height="28" rx="6" data-r="${ri}"/>`;
      return;
    }
    const tri = n.l === "DP" && n.k.length === 1 && n.k[0].w !== undefined;
    n.k.forEach(c => {
      if(tri) g += `<polygon class="ln" points="${n.x},${n.y+10} ${c.x-14},${c.y-14} ${c.x+14},${c.y-14}"/>`;
      else g += `<line class="ln" x1="${n.x}" y1="${n.y+11}" x2="${c.x}" y2="${c.y-13}"/>`;
    });
    n.k.forEach(c => walk(c, ri, false));
    const bad = o.bad && o.bad.has(n.sig), w = n.l.length*9.5 + 16;
    g += `<g class="nd ${bad?"bad":""}">` +
      (isRoot ? `<rect class="hit ${o.sel&&o.sel.includes(ri)?"sel":""}" x="${n.x-w/2}" y="${n.y-13}" width="${w}" height="26" rx="6" data-r="${ri}"/>` : "") +
      `<text x="${n.x}" y="${n.y+5}" text-anchor="middle">${esc(n.l)}</text></g>`;
  }
  roots.forEach((r,i) => walk(r, i, true));
  const W = acc + 8, H = TOP + maxD*DY + 26;
  return `<svg class="tree" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Syntax tree">${g}</svg>`;
}

/* ---------- 狀態 ---------- */
const stage = document.getElementById("stage");
let cur = 0;
const S = ITEMS.map(it => ({ forest: it.words.map((w,i)=>({w, i})), hist: [], sel: [], done: false, ok: null, msg: "" }));
const okCount = () => S.filter(s => s.ok === true).length;

function validSel(st){
  const s = st.sel; if(!s.length) return "Select a word or a piece of the tree to begin.";
  if(s.length === 2 && s[1] !== s[0]+1) return "Pick two pieces that sit next to each other.";
  return "";
}
function apply(st, label){
  const s = st.sel, F = st.forest, bare = i => F[i].w !== undefined;
  if(!s.length) return "Select something first.";
  if(s.length === 1){
    if(bare(s[0])){
      if(!HEADS.includes(label)) return "A word gets a category label first (N, V, T, A, P or DP). Build up from there.";
    }
    st.hist.push(clone(F));
    F[s[0]] = {l:label, k:[F[s[0]]]};
  } else {
    if(bare(s[0]) || bare(s[1])) return "Label each word with its category before joining it to anything.";
    st.hist.push(clone(F));
    F.splice(s[0], 2, {l:label, k:[F[s[0]], F[s[1]]]});
  }
  st.sel = []; return "";
}

function submit(it, st){
  const F = st.forest[0]; span(F); const mine = sigs(F);
  const missing = [...it.sigs].filter(x => !mine.has(x)), extra = [...mine].filter(x => !it.sigs.has(x));
  st.done = true; st.ok = !missing.length && !extra.length; st.missing = missing; st.extra = new Set(extra);
}
const describe = (sig, words) => { const [l,s,e] = sig.split("|"); return `<b>${esc(l)}</b> over <em>${words.slice(+s,+e+1).map(shown).join(" ")}</em>`; };

/* ---------- 畫面 ---------- */
function render(){
  const it = ITEMS[cur], st = S[cur];
  const dots = ITEMS.map((_,k)=>`<span class="dot ${S[k].ok===true?"ok":S[k].ok===false?"no":""} ${k===cur?"cur":""}"></span>`).join("");
  const F = st.forest, ready = F.length === 1 && !st.done;
  const treeHTML = drawForest(F, it.words, {sel:st.sel, bad:st.extra});
  let palette = "";
  if(!st.done){
    const grp = (name, arr) => `<div class="pgrp"><span class="pname">${name}</span>${arr.map(l=>`<button class="key" data-l="${esc(l)}">${esc(l)}</button>`).join("")}</div>`;
    palette = `<div class="palette">${grp("Word categories", HEADS)}${grp("Add a bar level", BARS)}${grp("Add a phrase", PHR)}</div>`;
  }
  let result = "";
  if(st.done){
    const miss = st.missing.length ? `<span>Missing: ${st.missing.map(m=>describe(m,it.words)).join("; ")}.</span>` : "";
    const ext = st.extra.size ? `<span>Not in the standard tree (marked red above): ${[...st.extra].map(m=>describe(m,it.words)).join("; ")}.</span>` : "";
    result = `<div class="expl ${st.ok?"":"bad"}"><span class="verdict">${st.ok?"Correct":"Not quite"}</span>${miss}${ext}<span>${it.e}</span></div>
      <details ${st.ok?"":"open"}><summary>Standard tree</summary><div class="treewrap">${drawForest([clone(it.tree)], it.words)}</div></details>`;
  }
  stage.innerHTML = `<section class="card">
    <div class="meta"><span>${it.ex} · Sentence ${cur+1} of ${ITEMS.length}</span><div class="dots">${dots}</div></div>
    <p class="q">Draw the tree for <em>${it.words.filter(w=>w!=="$").join(" ")}.</em></p>
    <p class="hint">1. Select a word, then choose its category. 2. Select one piece to add a bar level or phrase above it, or two neighbouring pieces to join them. 3. Keep going until one tree is left. <span class="hint-t">The tense slot [–PAST] is a word too: it is the T when there is no auxiliary.</span></p>
    <div class="treewrap" id="tw">${treeHTML}</div>
    ${palette}
    <p class="${st.msg?"err":"hint"}" id="msg">${esc(st.msg||validSelMsg(st))}</p>
    <div class="row"><div class="btns">${st.done?"":`<button class="btn" id="undo" ${st.hist.length?"":"disabled"}>Undo</button><button class="btn" id="reset" ${st.hist.length?"":"disabled"}>Start over</button>`}</div>
      <div class="btns">${st.done?"":`<button class="btn primary" id="submit" ${ready?"":"disabled"}>Submit</button>`}</div></div>
    ${result}
    <div class="row"><div class="btns"><button class="btn" id="prev" ${cur?"":"disabled"}>Previous</button></div>
      <div class="btns"><button class="btn primary" id="next" ${st.done&&cur<ITEMS.length-1?"":"disabled"}>Next</button></div></div>
    ${S.every(s=>s.done)?`<p class="hint">All done: ${okCount()} / ${ITEMS.length} correct.</p>`:""}
  </section>`;
  const $ = q => stage.querySelector(q);
  stage.querySelectorAll("#tw [data-r]").forEach(el => el.onclick = () => {
    if(st.done) return;
    const r = +el.dataset.r, i = st.sel.indexOf(r);
    st.msg = "";
    if(i >= 0) st.sel.splice(i,1);
    else if(st.sel.length === 1 && Math.abs(st.sel[0]-r) === 1) st.sel = [Math.min(r,st.sel[0]), Math.max(r,st.sel[0])];
    else st.sel = [r];
    render();
  });
  stage.querySelectorAll(".key").forEach(b => {
    const v = validSel(st); b.disabled = !!v;
    b.onclick = () => { st.msg = apply(st, b.dataset.l); render(); };
  });
  if($("#undo")) $("#undo").onclick = () => { F.splice(0, F.length, ...st.hist.pop()); st.sel = []; st.msg = ""; render(); };
  if($("#reset")) $("#reset").onclick = () => { st.forest = it.words.map((w,i)=>({w,i})); st.hist = []; st.sel = []; st.msg = ""; render(); };
  if($("#submit")) $("#submit").onclick = () => { submit(it, st); render(); };
  $("#prev").onclick = () => { cur--; render(); };
  $("#next").onclick = () => { cur++; render(); };
}
function validSelMsg(st){ return st.done ? "" : validSel(st); }
render();
</script>
