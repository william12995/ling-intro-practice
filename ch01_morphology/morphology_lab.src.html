<title>構詞練習</title>

<style>
:root{
  --ground:#F2F4F7; --surface:#FFFFFF; --ink:#1B2230; --muted:#5B6475; --line:#D9DEE7;
  --accent:#2F5BD3; --accent-soft:#E4EBFB; --cut:#D2463A; --cut-soft:#FBE7E4;
  --ok:#2E7D4F; --ok-soft:#E2F2E8; --warn:#9A6A12; --warn-soft:#F7EED9;
  --sans:"IBM Plex Sans","Noto Sans TC",system-ui,sans-serif;
  --serif:"IBM Plex Serif","Noto Sans TC",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#12151C; --surface:#1A1F29; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2C3340;
    --accent:#8FA8F7; --accent-soft:#232D47; --cut:#F07A6E; --cut-soft:#3A2224;
    --ok:#6CC894; --ok-soft:#1C3326; --warn:#E0B55C; --warn-soft:#352C18;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#12151C; --surface:#1A1F29; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2C3340;
  --accent:#8FA8F7; --accent-soft:#232D47; --cut:#F07A6E; --cut-soft:#3A2224;
  --ok:#6CC894; --ok-soft:#1C3326; --warn:#E0B55C; --warn-soft:#352C18;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;padding:0 16px}
.wrap{max-width:760px;margin:0 auto;padding-block:32px 64px;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,5vw,38px);line-height:1.2;margin:0;text-wrap:balance}
h1 .plus{color:var(--cut);font-family:var(--mono);font-weight:500;padding:0 .12em}
.lede{color:var(--muted);margin:0;max-width:62ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab .score{font-family:var(--mono);font-size:13px;margin-left:6px;color:var(--muted);font-variant-numeric:tabular-nums}
.levels{display:flex;gap:8px;flex-wrap:wrap}
.lv{appearance:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.lv[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:18px}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)} .dot.no{background:var(--cut)} .dot.cur{outline:2px solid var(--accent);outline-offset:1px}
.q{font-size:18px;margin:0}
.q em,.expl em{font-family:var(--serif);font-style:italic}
.data{font-family:var(--mono);font-size:14px;background:var(--ground);border-radius:6px;padding:10px 14px;overflow-x:auto;white-space:pre;line-height:1.7}
.opts{display:grid;gap:8px}
.opt{appearance:none;text-align:left;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-size:13px;color:var(--muted)}
.opt.seg{font-family:var(--mono);font-size:17px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--cut);background:var(--cut-soft)}
.opt:disabled{cursor:default}
.expl{border-left:3px solid var(--ok);padding:4px 0 4px 14px;margin:0;display:flex;flex-direction:column;gap:6px}
.expl.bad{border-left-color:var(--cut)}
.expl .verdict{font-weight:600}
.expl .src{font-size:13px;color:var(--muted)}
.gloss{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.gm{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 10px;min-width:48px}
.gm b{font-family:var(--mono);font-weight:600;font-size:16px}
.gm span{font-size:12px;color:var(--muted);text-align:center;line-height:1.35}
.gplus{align-self:center;color:var(--cut);font-family:var(--mono)}
.cutter{overflow-x:auto;padding-block:8px}
.word{display:inline-flex;align-items:stretch;font-family:var(--mono);font-size:clamp(24px,6vw,36px);font-weight:500;user-select:none}
.ch{padding:4px 0;line-height:1.3}
.gap{appearance:none;border:0;background:none;width:14px;padding:0;cursor:pointer;position:relative;color:inherit}
.gap::after{content:"";position:absolute;left:6px;top:14%;bottom:14%;width:2px;border-radius:1px;background:transparent}
.gap:hover::after{background:var(--line)}
.gap.on::after{background:var(--cut)}
.gap.miss::after{background:transparent;border-left:2px dashed var(--ok);width:0}
.gap.extra::after{background:var(--cut);opacity:.35}
.gap:disabled{cursor:default}
.hint{font-size:14px;color:var(--muted);margin:0}
.readout{font-family:var(--mono);font-size:15px;color:var(--muted);min-height:1.5em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;font:inherit;font-weight:500;font-size:15px;border-radius:8px;padding:8px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--cut);vertical-align:middle;margin-right:6px}
.legend i.m{border-top:2px dashed var(--ok)}
.done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.done .big{font-family:var(--serif);font-size:40px;font-weight:600;font-variant-numeric:tabular-nums}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.who b{color:var(--ink);font-weight:500;font-family:var(--mono)}
.linkbtn{appearance:none;border:0;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.sync{font-family:var(--mono);font-size:13px}
.sync .ok{color:var(--ok)} .sync .pend{color:var(--warn)}
.login{display:flex;flex-direction:column;gap:14px;max-width:420px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:14px;font-weight:500}
.field input{font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.err{color:var(--cut);font-size:14px;margin:0;min-height:1.4em}
@media (prefers-reduced-motion:no-preference){.expl{animation:fade .2s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
@media (max-width:480px){.card{padding:18px}}
.why{display:flex;flex-direction:column;gap:6px}
.why label{font-size:14px;font-weight:500}
.why textarea{font:inherit;font-size:15px;line-height:1.6;min-height:96px;resize:vertical;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.why textarea:focus-visible,.fill input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.why textarea:disabled,.fill input:disabled{background:var(--ground);color:var(--ink)}
.why .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);align-self:flex-end}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .box{font-family:var(--mono);font-size:14px;color:var(--muted);min-width:1.2em}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.fill{display:flex;flex-direction:column;gap:8px}
.fill input{font-family:var(--mono);font-size:18px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:420px}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.key{appearance:none;font-family:var(--mono);font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:2px 12px;cursor:pointer}
.dot.sub{background:var(--muted)}
.credit{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.credit a{color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">語言學概論 · Morphology</div>
    <h1>re<span class="plus">+</span>place<span class="plus">+</span>s：構詞練習</h1>

  <div class="who" id="who" hidden></div>

<script>
/* 題目資料。題號照陣列位置編（S1-01…），學生開始作答後只能在最後加題，不能調換或替換。
   type: mc 單選（a 是正解的索引）／multi 複選（o[].s：y 必選、n 不能選、e 選不選都可以）／
         cut 切詞（m 是正確切法，alt 是也算對的切法）／fill 填空（accept 是正規化後的答案）
   grade:false 表示不計分，只收答案和推理。 */
const SECTIONS = [
  {name:"1　詞綴與類型", ex:"習題 3", note:"找出詞裡的詞綴，判斷是衍生還是屈折。", items:[
    {type:"mc", q:"<em>purity</em>", o:["-ity，衍生","-ity，屈折","-y，屈折","沒有詞綴"], a:0,
     e:"pure（形容詞）加 -ity 變成名詞。會改詞類的是衍生詞綴。拼寫上 pure 的 e 掉了。"},
    {type:"mc", q:"<em>newest</em>", o:["-est，衍生","-est，屈折，表最高級","-st，屈折，表複數","new 和 est 都是詞根"], a:1,
     e:"-est 是最高級，newest 還是形容詞，詞類沒變，只多了文法資訊，所以是屈折。"},
    {type:"mc", q:"<em>misunderstand</em>", o:["mis-，衍生","mis-，屈折","mis- 和 under- 都是屈折","沒有詞綴"], a:0,
     e:"mis- 是「錯誤地」，加了以後仍是動詞，但多了詞彙意義，是衍生。英文的前綴都是衍生詞綴。understand 歷史上是 under + stand，但今天的意思沒辦法從兩個部分推出來，這題不要求切它。"},
    {type:"mc", q:"<em>Canadian</em>", o:["-ian，衍生","-ian，屈折","-an，屈折","沒有詞綴"], a:0,
     e:"Canada（名詞）加 -ian，變成「加拿大的」或「加拿大人」。拼寫上兩個 a 合成一個。"},
    {type:"mc", q:"<em>unlikely</em>", o:["un- 和 -ly，都是衍生","un- 衍生，-ly 屈折","只有 un-，衍生","un- 屈折，-ly 衍生"], a:0,
     e:"like 加 -ly 先變成形容詞 likely，再加 un-。-ly 改了詞類，是衍生。這裡的 likely 是形容詞，不是副詞。"},
    {type:"mc", q:"<em>weaken</em>", o:["-en，屈折，表過去分詞","-en，衍生，形容詞變動詞","-n，屈折，表複數","沒有詞綴"], a:1,
     e:"weak（形容詞）變成 weaken（動詞）。跟 eaten 的 -en 發音一樣，但意義和功能不同，是兩個語素。"},
    {type:"mc", q:"<em>nieces</em>", o:["-s，衍生","-s，屈折，表複數","-s，屈折，表第三人稱單數","沒有詞綴"], a:1,
     e:"niece 是名詞，-s 標複數，是屈折。第三人稱單數的 -s 只接在動詞上。"},
    {type:"mc", q:"<em>expectantly</em>", o:["-ant 和 -ly，都是衍生","只有 -ly，衍生","-ant 衍生，-ly 屈折","-ant 屈折，-ly 衍生"], a:0,
     e:"expect（動詞）加 -ant 變成形容詞 expectant，再加 -ly 變成副詞。兩次都改了詞類。"}
  ]},
  {name:"2　詞類判斷", ex:"習題 4", note:"判斷斜體字在句子裡的詞類。推理欄請寫你用了什麼判準：詞的形態、它在句子裡的位置，還是意義。", items:[
    {type:"mc", q:"The car goes very <em>fast</em>.", o:["名詞","動詞","形容詞","副詞"], a:3,
     e:"fast 修飾動詞 goes，前面還能加 very。它沒有 -ly，但位置和功能都是副詞。"},
    {type:"mc", q:"Amy likes hot <em>weather</em>.", o:["名詞","動詞","形容詞","副詞"], a:0,
     e:"weather 前面有形容詞 hot 修飾，整個 hot weather 是 likes 的受詞。"},
    {type:"mc", q:"Some <em>babies</em> never sleep.", o:["名詞","動詞","形容詞","副詞"], a:0,
     e:"babies 帶複數 -s，前面有 some，當句子的主詞。"},
    {type:"mc", q:"I <em>dream</em> about the future.", o:["名詞","動詞","形容詞","副詞"], a:1,
     e:"dream 接在主詞 I 後面，可以換成過去式 dreamed。"},
    {type:"mc", q:"I had a <em>dream</em> last night.", o:["名詞","動詞","形容詞","副詞"], a:0,
     e:"dream 在冠詞 a 後面，當 had 的受詞。跟上一題同一個形式，詞類不同，要看它在句子裡的位置。"},
    {type:"mc", q:"Our <em>discussion</em> was very interesting.", o:["名詞","動詞","形容詞","副詞"], a:0,
     e:"discussion 前面有 our，當主詞。-ion 接在動詞 discuss 後面，做出名詞。"},
    {type:"mc", q:"They started to run <em>quickly</em>.", o:["名詞","動詞","形容詞","副詞"], a:3,
     e:"quick（形容詞）加 -ly 變副詞，修飾 run。"},
    {type:"mc", q:"I appreciate your <em>politeness</em>.", o:["名詞","動詞","形容詞","副詞"], a:0,
     e:"polite（形容詞）加 -ness 變名詞，前面有 your，當受詞。"},
    {type:"mc", q:"The store <em>misclassified</em> that book.", o:["名詞","動詞","形容詞","副詞"], a:1,
     e:"misclassified 在主詞後面、受詞前面，帶過去式 -ed。"},
    {type:"mc", q:"She founded a <em>nongovernmental</em> organization.", o:["名詞","動詞","形容詞","副詞"], a:2,
     e:"nongovernmental 在冠詞 a 和名詞 organization 中間，修飾名詞。"},
    {type:"cut", w:"discussion", m:["discuss","ion"], g:["動詞詞根","動→名"],
     e:"-ion 只接動詞，接上以後變名詞。"},
    {type:"cut", w:"misclassified", m:["mis","class","ifi","ed"], g:["「錯誤地」","名詞詞根","-ify 名→動","過去式（屈折）"],
     e:"class 加 -ify 變動詞 classify，再加 mis-，最後加屈折的 -ed。-ify 在 -ed 前面拼成 ifi。"},
    {type:"cut", w:"nongovernmental", m:["non","govern","ment","al"], g:["否定前綴","動詞詞根","動→名","名→形"],
     e:"govern → government（名詞）→ governmental（形容詞）→ nongovernmental。-al 接名詞，所以要先有 government。"}
  ]},
  {name:"3　複合詞", ex:"習題 6", note:"選出句子裡所有的複合詞。英文複合詞可以連寫、分開寫或加連字號，拼法不是判斷依據。", items:[
    {type:"multi", q:"Amélie Tourain leaned forward a little and switched on her desk light.",
     o:[{t:"desk light",s:"y"},{t:"leaned forward",s:"n"},{t:"switched on",s:"n"},{t:"a little",s:"n"}],
     e:"desk light 是兩個名詞詞根合成一個名詞，意思是「桌燈」。leaned forward、switched on 是動詞加一個副詞或小品詞，兩個詞各自獨立，是片語。"},
    {type:"multi", q:"The third occasion on which she said something funny the headmistress had glanced at her over Doris Anderson’s note-book, then at Mlle Devaux, and after that things went much easier with the grammar teacher.",
     o:[{t:"headmistress",s:"y"},{t:"note-book",s:"y"},{t:"grammar teacher",s:"y"},{t:"something",s:"e"},{t:"occasion",s:"n"},{t:"much easier",s:"n"}],
     e:"headmistress、note-book、grammar teacher 各有連寫、連字號、分開寫三種拼法，都是複合詞。something 是 some + thing，現在大多當成一個詞在用，選或不選都算對。"},
    {type:"multi", q:"Mlle Tourain was sitting back in her chair now, and had begun to tap the rubber end of her pencil against the brass ink-pot.",
     o:[{t:"ink-pot",s:"y"},{t:"rubber end",s:"e"},{t:"sitting back",s:"n"},{t:"pencil",s:"n"}],
     e:"ink-pot 是 ink + pot。rubber end 可以看成複合詞（鉛筆有橡皮擦的那一頭），也可以看成形容詞性的名詞修飾名詞的片語，兩種分析都說得通，選不選都算對。"},
    {type:"multi", q:"She had spoken with an undercurrent of passion running through her words, as she was speaking now.",
     o:[{t:"undercurrent",s:"y"},{t:"running through",s:"n"},{t:"passion",s:"n"},{t:"spoken",s:"n"}],
     e:"undercurrent 是介系詞 under 加名詞 current，整個詞是名詞，中心語在右邊。"}
  ]},
  {name:"4　希伯來文複合詞", ex:"習題 7", note:"看資料回答。每組第一行是希伯來文，第二行是逐詞意思，第三行是整個複合詞的意思。", items:[
    {type:"mc", q:"哪些詞類的詞根可以組成複合詞？",
     d:"beyt xolim     batey sefer    'orex din\nhouse patient  houses book    editor law\nhospital       schools        lawyer\n\nyom huledet    gan xayot      gan yeladim\nday birth      garden animals garden children\nbirthday       zoo            kindergarten",
     o:["名詞＋名詞","名詞＋形容詞","動詞＋名詞","形容詞＋形容詞"], a:0,
     e:"六組的兩個成分都是名詞：house、patient、book、editor、law、day、birth、garden、animals、children。"},
    {type:"mc", q:"希伯來文複合詞的中心語在左邊還是右邊？",
     d:"beyt xolim     batey sefer    'orex din\nhouse patient  houses book    editor law\nhospital       schools        lawyer\n\nyom huledet    gan xayot      gan yeladim\nday birth      garden animals garden children\nbirthday       zoo            kindergarten",
     o:["左邊","右邊","兩邊都是","資料看不出來"], a:0,
     e:"醫院是一種 house，動物園是一種 garden，所以決定整個詞是什麼東西的是左邊的詞。batey sefer「學校（複數）」把複數標在左邊的 batey（houses）上，也說明左邊是中心語。英文剛好相反，greenhouse 是一種 house，中心語在右邊。"}
  ]},
  {name:"5　土耳其文", ex:"習題 1", note:"資料用國際音標轉寫。先找出每個語素的意思，最後自己造一個詞。", items:[

const TR = "deniz        'an ocean'             elim             'my hand'\ndenize       'to an ocean'          eller            'hands'\ndenizin      'of an ocean'          diʃler           'teeth'\neve          'to a house'           diʃimizin        'of our tooth'\nevden        'from a house'         diʃlerimizin     'of our teeth'\nevdʒıkden    'from a little house'  eldʒıke          'to a little hand'\ndenizdʒıkde  'in a little ocean'    denizlerimizde   'in our oceans'\nelde         'in a hand'            evdʒıklerimizde  'in our little houses'";
const KR = "panie  'basket'   paniea  'the basket'\ntrou   'hole'     troua   'the hole'\nchẽ    'dog'      chẽã    'the dog'\npitit  'child'    pititla 'the child'\nãj     'angel'    ãjla    'the angel'\nmadãm  'lady'     madãmla 'the lady'";
SECTIONS.forEach(s=>s.items.forEach(it=>{if(it.d==="__TR__")it.d=TR;else if(it.d==="__KR__")it.d=KR}));

const WHY_MAX = 300, WHY_MIN = 5;
const freshState = () => ({v:2, lv:0, bySec:SECTIONS.map(()=>({i:0,res:[],ans:{},why:{},attempt:1}))});
let state = freshState();
const stage = document.getElementById("stage");
const levelsEl = document.getElementById("levels");

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function plain(s){return String(s).replace(/<[^>]+>/g,"")}
const pad2 = n => String(n).padStart(2,"0");
// 填空正規化：去掉空白、+、-、·，小寫；ı→i；dʒ 的各種打法（ʤ、dʒ、dj、c、j）統一成 D
function normFill(s){
  return String(s).toLowerCase().replace(/[\s+\-·.]/g,"").replace(/ı/g,"i").replace(/ʤ|dʒ|dj|c|j/g,"D");
}
function cutsOf(m){const s=new Set();let p=0;for(let k=0;k<m.length-1;k++){p+=m[k].length;s.add(p)}return s}
function splitAt(w,cuts){const parts=[];let last=0;[...cuts].sort((a,b)=>a-b).forEach(p=>{parts.push(w.slice(last,p));last=p});parts.push(w.slice(last));return parts}

/* 判分：回傳 {ok, response}。ok 為 null 表示不計分。 */
function grade(it, ans){
  if(it.type==="mc"){
    return {ok: it.grade===false ? null : ans===it.a, response: plain(it.o[ans])};
  }
  if(it.type==="multi"){
    const picked=new Set(ans||[]);
    const ok=it.o.every((o,k)=>o.s==="y"?picked.has(k):o.s==="n"?!picked.has(k):true);
    return {ok, response: [...picked].sort((a,b)=>a-b).map(k=>it.o[k].t).join(" / ") || "（都不選）"};
  }
  if(it.type==="cut"){
    const cuts=new Set(ans||[]);
    const same=(A,B)=>A.size===B.size&&[...A].every(p=>B.has(p));
    const ok=[it.m,...(it.alt||[])].some(m=>same(cuts,cutsOf(m)));
    return {ok, response: cuts.size?splitAt(it.w,cuts).join(" + "):"（不切）"};
  }
  if(it.type==="fill"){
    return {ok: it.accept.includes(normFill(ans||"")), response: String(ans||"")};
  }
}

/* ---------- 學生登入與成績記錄 ---------- */
// build_site.py 會把 __ENDPOINT__ 換成 Apps Script 網址；沒換就只存在本機。
const ENDPOINT = "__ENDPOINT__";
const QUIZ_ID = "ch01_morphology";
const ONLINE = /^https:\/\//.test(ENDPOINT);
const QKEY = "ling_queue", DLKEY = "ling_deadletter";
const URL_MAX = 6000;   // 整條 GET 網址的上限。中文一個字編碼後佔 9 個字元，推理欄 300 字約 2700。
const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let student = LS.get("ling_student", null);

const progKey = () => `ling_prog_v2_${QUIZ_ID}_${student.sid}`;
function saveProg(){ if(student) LS.set(progKey(), state); }
function loadProg(){
  const s = LS.get(progKey(), null);
  state = (s && s.v===2 && Array.isArray(s.bySec) && s.bySec.length===SECTIONS.length) ? s : freshState();
}

// 每次作答一筆，event_id 唯一；後端看到重複的 event_id 就跳過，所以重送不會多出列。
let seq = 0;
function urlLen(p){ return ENDPOINT.length + 40 + encodeURIComponent(JSON.stringify(p)).length; }
function record(level, qid, prompt, response, correct, attempt, reasoning){
  const t = Date.now();
  const p = {event_id:`${student.sid}|${QUIZ_ID}|${qid}|${attempt}|${t}-${seq++}`,
    client_time:new Date(t).toISOString(), quiz:QUIZ_ID, student_id:student.sid, name:student.name,
    part:"S", level, qid, prompt:prompt.slice(0,120), response:response.slice(0,200),
    correct: correct===null ? "" : (correct?1:0), attempt, reasoning};
  // 網址太長會被 Google 擋下，而且會卡住後面所有紀錄，所以送出前先截短推理欄
  while(urlLen(p) > URL_MAX && p.reasoning.length > 0){ p.reasoning = p.reasoning.slice(0, Math.floor(p.reasoning.length*0.8)); p.truncated = 1; }
  if(!ONLINE) return;
  const q = LS.get(QKEY, []); q.push(p); LS.set(QKEY, q);
  flush();
}
function jsonp(p){
  return new Promise((res,rej)=>{
    const cb = "cb_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const t = setTimeout(()=>{cleanup();rej({server:false,error:"timeout"})}, 15000);
    function cleanup(){clearTimeout(t);delete window[cb];s.remove()}
    window[cb] = r => {cleanup(); if(r&&r.ok) res(r); else rej({server:!(r&&r.retry), error:(r&&r.error)||"rejected"}); };  // retry=暫時性錯誤，留著重送
    s.onerror = () => {cleanup();rej({server:false,error:"network"})};
    s.src = ENDPOINT + "?callback=" + cb + "&data=" + encodeURIComponent(JSON.stringify(p));
    document.body.appendChild(s);
  });
}
let flushing = false;
async function flush(){
  if(!ONLINE || flushing) return;
  flushing = true; renderSync();
  let q = LS.get(QKEY, []);
  while(q.length){
    const sent = q[0];
    try{ await jsonp(sent); }
    catch(e){
      if(e && e.server){ const dl = LS.get(DLKEY, []); dl.push({payload:sent, error:e.error}); LS.set(DLKEY, dl); }
      else break;   // 斷網或逾時：留在佇列，下次再送
    }
    q = LS.get(QKEY, []).filter(x => x.event_id !== sent.event_id); LS.set(QKEY, q);
  }
  flushing = false; renderSync();
}
function renderSync(){
  const el = document.getElementById("sync"); if(!el) return;
  if(!ONLINE){ el.innerHTML = '<span class="pend">成績只存在這台電腦</span>'; return; }
  const n = LS.get(QKEY, []).length, dl = LS.get(DLKEY, []).length;
  let s = n ? `<span class="pend">上傳中，還有 ${n} 筆</span>` : '<span class="ok">成績已記錄</span>';
  if(dl) s += ` <span class="pend">有 ${dl} 筆沒被收下，請告訴助教</span>`;
  el.innerHTML = s;
}
function renderWho(){
  const el = document.getElementById("who");
  if(!student){ el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<span>作答者：<b>${esc(student.sid)}</b> ${esc(student.name)}　<button class="linkbtn" id="logout">換人作答</button></span><span class="sync" id="sync"></span>`;
  document.getElementById("logout").onclick = () => { student = null; LS.set("ling_student", null); state = freshState(); renderWho(); route(); };

}
function renderLogin(){
  levelsEl.hidden = true;
  stage.innerHTML = `<section class="card"><form class="login" id="login" novalidate>
    <p class="q">開始前請填學號和姓名。</p>
    <div class="field"><label for="sid">學號</label><input id="sid" autocomplete="off" placeholder="例如 B13012345" maxlength="9"></div>
    <div class="field"><label for="sname">姓名</label><input id="sname" autocomplete="name" maxlength="30"></div>
    <p class="err" id="lerr"></p>
    <div><button class="btn primary" type="submit">開始作答</button></div></form></section>`;
  document.getElementById("login").onsubmit = e => {

function route(){
  if(!student){ renderLogin(); return; }
  renderSec();
}
function dots(total,res,cur){
  let h='<div class="dots" aria-hidden="true">';
  for(let k=0;k<total;k++){const r=res[k];h+=`<span class="dot ${r===true?"ok":r===false?"no":r===null?"sub":""} ${k===cur?"cur":""}"></span>`}
  return h+"</div>";
}
const tally = res => res.filter(x=>x===true).length;
const graded = sec => sec.items.filter(it=>it.grade!==false).length;
function glossHTML(m,g){
  return '<div class="gloss">'+m.map((x,k)=>(k?'<span class="gplus">+</span>':'')+`<div class="gm"><b>${esc(x)}</b><span>${g[k]}</span></div>`).join("")+"</div>";
}
function navRow(onPrev,onNext,canPrev,canNext,nextLabel){
  const row=document.createElement("div");row.className="row";
  row.innerHTML=`<div class="btns"><button class="btn" id="nav-prev" ${canPrev?"":"disabled"}>上一題</button></div><div class="btns"><button class="btn primary" id="nav-next" ${canNext?"":"disabled"}>${nextLabel}</button></div>`;
  row.querySelector("#nav-prev").onclick=onPrev;row.querySelector("#nav-next").onclick=onNext;
  return row;
}
function doneCard(score,total,msg,onRestart,extraBtn){
  stage.innerHTML=`<section class="card done"><div class="eyebrow">完成</div><div class="big">${total?`${score} / ${total}`:"已送出"}</div><p class="hint">${msg}</p><div class="btns"><button class="btn" id="restart">重新作答</button>${extraBtn||""}</div></section>`;
  document.getElementById("restart").onclick=onRestart;
}
function renderLevels(){
  levelsEl.hidden=false;
  levelsEl.innerHTML=SECTIONS.map((s,k)=>{const L=state.bySec[k],n=graded(s);return `<button class="lv" data-lv="${k}" aria-pressed="${k===state.lv}">${s.name}<span style="font-family:var(--mono);font-size:12px;margin-left:6px;opacity:.8">${n?`${tally(L.res)}/${n}`:`${L.res.filter(x=>x!==undefined).length}/${s.items.length}`}</span></button>`}).join("");
  levelsEl.querySelectorAll(".lv").forEach(b=>b.onclick=()=>{state.lv=+b.dataset.lv;renderSec()});
}

/* ---------- 作答卡：先選答案、寫推理，按送出後才判分和顯示解說 ---------- */
function renderSec(){
  renderLevels();
  const lvI=state.lv, SEC=SECTIONS[lvI], S=state.bySec[lvI];
  saveProg();
  if(S.i>=SEC.items.length){
    const nextLv=lvI+1<SECTIONS.length;
    doneCard(tally(S.res),graded(SEC),nextLv?"這一部分做完了，下一部分更難。":"全部做完了。",
      ()=>{S.i=0;S.res=[];S.ans={};S.why={};S.attempt=(S.attempt||1)+1;renderSec()},nextLv?'<button class="btn primary" id="next-lv">下一部分</button>':"");
    if(nextLv)document.getElementById("next-lv").onclick=()=>{state.lv++;renderSec()};
    return;
  }
  const it=SEC.items[S.i];
  const done=S.res[S.i]!==undefined;
  let ans = S.ans[S.i];
  if(ans===undefined) ans = it.type==="multi"||it.type==="cut" ? [] : it.type==="fill" ? "" : null;
  const card=document.createElement("section");card.className="card";
  card.innerHTML=`<div class="meta"><span>${esc(SEC.ex)} · 第 ${S.i+1} / ${SEC.items.length} 題</span>${dots(SEC.items.length,S.res,S.i)}</div>
    <p class="hint">${SEC.note}</p>
    ${it.type==="cut"?`<p class="q">把 <em>${esc(it.w)}</em> 切到最小的語素。</p>`:`<p class="q">${it.q}</p>`}
    ${it.d?`<div class="data">${esc(it.d)}</div>`:""}
    <div id="widget"></div>
    <div class="why"><label for="why">推理過程：你怎麼得到這個答案？</label>
      <textarea id="why" maxlength="${WHY_MAX}" placeholder="至少寫一句，例如你比較了哪些詞、用了什麼判準"></textarea>
      <span class="cnt" id="cnt"></span></div>
    <div class="row"><span class="hint" id="need"></span><div class="btns"><button class="btn primary" id="submit">送出</button></div></div>
    <div id="fb"></div>`;
  const W=card.querySelector("#widget"), why=card.querySelector("#why"), btn=card.querySelector("#submit");
  why.value=S.why[S.i]||"";

  const hasAns=()=>it.type==="mc"?ans!==null:it.type==="fill"?String(ans).trim()!=="":true;
  const refresh=()=>{
    const n=why.value.trim().length;
    card.querySelector("#cnt").textContent=`${why.value.length} / ${WHY_MAX}`;
    const miss=[];if(!hasAns())miss.push("先作答");if(n<WHY_MIN)miss.push(`推理至少寫 ${WHY_MIN} 個字`);
    card.querySelector("#need").textContent=done?"":miss.join("，");
    btn.disabled=done||miss.length>0;
  };
  why.oninput=()=>{S.why[S.i]=why.value;saveProg();refresh()};

  // 各題型的作答元件。locked 之後只顯示結果。
  const drawWidget=()=>{
    if(it.type==="mc"){
      W.innerHTML=`<div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${o}</span></button>`).join("")}</div>`;
      W.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.k;
        if(done){b.disabled=true;if(it.grade!==false&&k===it.a)b.classList.add("right");else if(k===ans)b.classList.add(it.grade===false?"sel":"wrong")}
        else{if(k===ans)b.classList.add("sel");b.onclick=()=>{ans=k;S.ans[S.i]=k;saveProg();drawWidget();refresh()}}});
    }else if(it.type==="multi"){
      const picked=new Set(ans);
      W.innerHTML=`<p class="hint">可以選好幾個，也可以都不選。</p><div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="${picked.has(k)}"><span class="box">${picked.has(k)?"☑":"☐"}</span><span>${esc(o.t)}</span></button>`).join("")}</div>`;
      W.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.k,o=it.o[k];
        if(done){b.disabled=true;
          if(picked.has(k))b.classList.add(o.s==="n"?"wrong":"right");
          else if(o.s==="y")b.classList.add("miss");}
        else{if(picked.has(k))b.classList.add("sel");
          b.onclick=()=>{picked.has(k)?picked.delete(k):picked.add(k);ans=[...picked];S.ans[S.i]=ans;saveProg();drawWidget();refresh()}}});
    }else if(it.type==="cut"){
      const w=it.w, answer=cutsOf(it.m), cuts=new Set(ans), okNow=done&&S.res[S.i]===true;
      let h="";
      for(let k=0;k<w.length;k++){
        if(k>0){
          let cls=cuts.has(k)?"on":"";
          if(done&&!okNow){if(cuts.has(k)&&!answer.has(k))cls="on extra";else if(!cuts.has(k)&&answer.has(k))cls="miss"}
          h+=`<button class="gap ${cls}" data-p="${k}" aria-label="在 ${w[k-1]} 和 ${w[k]} 之間切" ${done?"disabled":""}></button>`;
        }
        h+=`<span class="ch">${esc(w[k])}</span>`;
      }
      W.innerHTML=`<p class="hint">點字母之間的空隙切一刀，再點一次取消。</p><div class="cutter"><div class="word">${h}</div></div>
        <div class="readout">${cuts.size?esc(splitAt(w,cuts).join(" + ")):"（還沒切，一刀不切就代表單語素詞）"}</div>
        ${done?'<div class="legend"><span><i></i>你切的位置</span><span><i class="m"></i>漏切的位置</span></div>':'<div class="btns"><button class="btn" id="clear">全部清除</button></div>'}`;
      if(!done){
        W.querySelectorAll(".gap").forEach(g=>g.onclick=()=>{const p=+g.dataset.p;cuts.has(p)?cuts.delete(p):cuts.add(p);ans=[...cuts];S.ans[S.i]=ans;saveProg();drawWidget()});
        W.querySelector("#clear").onclick=()=>{ans=[];S.ans[S.i]=[];saveProg();drawWidget()};
      }
    }else if(it.type==="fill"){
      W.innerHTML=`<div class="fill"><input id="fillin" autocomplete="off" spellcheck="false" placeholder="${esc(it.ph||"")}" ${done?"disabled":""}>
        ${done?"":`<div class="keys">${it.keys.map(c=>`<button class="key" data-c="${esc(c)}">${esc(c)}</button>`).join("")}<span class="hint">點符號插入</span></div>`}</div>`;
      const inp=W.querySelector("#fillin");inp.value=ans;
      inp.oninput=()=>{ans=inp.value;S.ans[S.i]=ans;saveProg();refresh()};
      W.querySelectorAll(".key").forEach(b=>b.onclick=()=>{
        const c=b.dataset.c, s=inp.selectionStart??inp.value.length, e=inp.selectionEnd??s;
        inp.value=inp.value.slice(0,s)+c+inp.value.slice(e);inp.focus();inp.setSelectionRange(s+c.length,s+c.length);inp.oninput()});
    }
  };

  const feedback=()=>{
    const ok=S.res[S.i];
    let verdict = ok===null ? "已送出（這題不計分）" : ok ? "答對了" : "答錯了";
    let extra="";
    if(it.type==="mc"&&ok===false) verdict+=`，正確答案是 ${"ABCD"[it.a]}`;
    if(it.type==="multi"&&ok===false) extra='<span>綠色虛線是漏選的，紅色是不該選的。</span>';
    if(it.type==="cut") extra=glossHTML(it.m,it.g);
    card.querySelector("#fb").innerHTML=`<div class="expl ${ok===false?"bad":""}"><span class="verdict">${verdict}</span>${extra}<span>${it.e}</span></div>`;
  };

  btn.onclick=()=>{
    if(btn.disabled)return;
    const reasoning=why.value.trim();
    const g=grade(it,ans);
    S.ans[S.i]=ans;S.why[S.i]=reasoning;S.res[S.i]=g.ok;
    const qid=`S${lvI+1}-${pad2(S.i+1)}`;
    const prompt=it.type==="cut"?it.w:plain(it.q);
    record(lvI+1,qid,prompt,g.response,g.ok,S.attempt||1,reasoning);
    saveProg();renderSec();
  };

  drawWidget();
  if(done){why.disabled=true;feedback()}
  refresh();
  stage.innerHTML="";stage.appendChild(card);
  const nav=navRow(()=>{S.i--;renderSec()},()=>{S.i++;renderSec()},S.i>0,done,S.i===SEC.items.length-1?"看這部分成績":"下一題");
  card.appendChild(nav);
}

if(student) loadProg();
renderWho(); route();
flush(); setInterval(flush, 20000);
window.addEventListener("online", flush);
</script>
